name: Dependencies

# Dependency hygiene: audit the committed lockfiles (Go go.sum + npm package-lock.json) with Trivy
# (pinned by SHA). Lockfile updates belong in dependency-update pull requests, not in this audit.
# A HIGH/CRITICAL fixable vulnerability fails the job; the weekly run catches newly-disclosed CVEs.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    name: Trivy dependency audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy vulnerability audit (Go + npm locks)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'        # block on a fixable HIGH/CRITICAL
          format: table
