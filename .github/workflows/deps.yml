name: Dependencies

# Dependency hygiene: refresh the lockfile WITHOUT installing anything, then audit every locked
# dependency (Go go.sum + npm package-lock.json) with Trivy (pinned by SHA). A HIGH/CRITICAL
# fixable vulnerability fails the job: the gate blocks. Re-runs weekly to catch newly-disclosed CVEs.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    name: Trivy dependency audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Refresh the site lockfile without installing
        working-directory: site
        run: npm install --package-lock-only --ignore-scripts

      - name: Trivy vulnerability audit (Go + npm locks)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'        # block on a fixable HIGH/CRITICAL
          format: table
