name: Dependencies

# Dependency hygiene: audit the committed lockfiles (Go go.mod, npm package-lock.json, uv.lock) with
# Trivy, pinned in mise.toml. Lockfile updates belong in dependency-update pull requests, not here.
# A HIGH/CRITICAL fixable vulnerability fails the job; the weekly run catches newly-disclosed CVEs.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    name: Trivy dependency audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Trivy from the repository toolchain, not aquasecurity/trivy-action. The action installs the
      # binary through aquasecurity/setup-trivy, which runs its own actions/checkout WITHOUT
      # persist-credentials: false, leaving GITHUB_TOKEN in .git/config (Plumber ISSUE-307) in a
      # transitive action whose inputs we do not control. Pinning the binary in mise.toml removes
      # the finding instead of accepting it, and it is the same version developers run locally.
      #
      # It also widened what gets audited, though not by itself: uv.lock was matched by a blanket
      # `*.lock` in .gitignore and had never been committed, so no runner ever had a uv lockfile to
      # read and the Python tooling was the one dependency set here that nothing scanned. Tracking
      # it (see .gitignore) and scanning it reported 17 fixable HIGH/CRITICAL advisories (pyjwt,
      # authlib, cryptography, certifi, anyio, dnspython, joserfc), closed by `uv lock --upgrade`
      # in this same change. That is why this job now names three lockfiles, not two.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.2.23
          install: true
          cache: true

      - name: Trivy vulnerability audit (Go + npm + uv locks)
        run: |
          set -euo pipefail
          trivy --version
          # Blocks on a FIXABLE HIGH/CRITICAL: --ignore-unfixed keeps the job about what can be
          # acted on today, and --exit-code 1 is what makes the audit a gate rather than a report.
          trivy fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            .
