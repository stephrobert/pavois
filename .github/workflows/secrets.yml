name: Secret scan

# TruffleHog scans every push and PR for committed credentials (verified + unknown). A verified
# secret fails the job — the gate against a leaked key landing in history. Mirrors the local
# pre-commit hook and the `detect-private-key` pre-commit check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout (full history for range scan)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@00155c9dc586f34d189adc83d3ac2698c2ec551f # v3.95.8
        with:
          extra_args: --results=verified,unknown
