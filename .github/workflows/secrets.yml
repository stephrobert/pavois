name: Secret scan

# TruffleHog scans every push and PR for committed credentials (verified + unknown). A verified
# secret fails the job: the gate against a leaked key landing in history. Mirrors the local
# pre-commit hook and the `detect-private-key` pre-commit check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout (full history for range scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          extra_args: --results=verified,unknown

  # The job above scans a RANGE: what this push or PR adds. Nothing had ever re-read the commits
  # that predate the hooks, which is the question that matters when a repository goes public, since
  # publishing ships every commit, not the tip.
  #
  # It also runs the lab detectors, which until now existed only in the local pre-commit hook. A
  # local hook is skippable with --no-verify, absent from a fresh clone that never ran
  # `pre-commit install`, and bypassed entirely by an edit made in the GitHub web UI. The rule was
  # therefore enforced only for whoever remembered to enforce it.
  #
  # Measured at ~5s over 462 commits, so it runs on every PR rather than on a schedule.
  history:
    name: TruffleHog (full history)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout (every commit, this is the point)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # mise already pins trufflehog for the pre-commit hooks; reuse that pin rather than curling an
      # installer, so the CI and the developer machines run the same binary.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.2.23
          install: true
          cache: true

      - name: Every commit, credentials and lab topology
        run: mise run secrets:history
