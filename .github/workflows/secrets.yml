name: Secret scan

# TruffleHog scans every push and PR for committed credentials (verified + unknown). A verified
# secret fails the job — the gate against a leaked key landing in history. Mirrors the local
# pre-commit hook and the `detect-private-key` pre-commit check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout (full history for range scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          extra_args: --results=verified,unknown
