name: Plumber compliance

# Validates Pavois's own CI/CD with Plumber (getplumber.io), the same way Plumber validates
# itself: analyze the repo's GitHub Actions workflows + repo settings against .plumber.yaml,
# upload findings to Code Scanning, and fail below the compliance threshold. The action verifies
# the downloaded Plumber binary's SLSA build-provenance attestation before running it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  plumber:
    name: Plumber analyze
    # Draft while the repo is private: uploading SARIF to Code Scanning needs GitHub Advanced
    # Security (public repos get it free), and Plumber's API checks need broader access than a
    # private default token grants. Skips on private, activates automatically once public.
    #
    # And skipped on Dependabot's own pull requests, which is not indulgence. Those runs do NOT
    # receive Actions secrets: Dependabot has a separate secret store, so PLUMBER_ADMIN_TOKEN
    # resolves to the empty string and the action errors out before scanning anything. The failure
    # carried an EMPTY exit code, which is how you tell it apart from a real finding. Every
    # Dependabot pull request would be red for a reason that has nothing to do with its contents,
    # and a check that is always red is a check people learn to scroll past.
    #
    # Nothing is left unaudited: this same workflow runs on every push to main, so a Dependabot
    # change that touches a workflow is scanned once it lands. The coverage is deferred, not lost.
    # To audit them on the pull request instead, give Dependabot the token:
    #   gh secret set PLUMBER_ADMIN_TOKEN --app dependabot
    if: ${{ !github.event.repository.private && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write   # upload SARIF to Code Scanning
      actions: read            # read the workflow run (Plumber telemetry / status)
      id-token: write          # OIDC to publish the compliance score to score.getplumber.io
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Plumber compliance scan
        uses: getplumber/plumber@10837e44cddfed934eaa2b509e677286af23e149 # v0.4.63
        with:
          # The CLI version, which is what actually scans: a separate pin from the action above,
          # and it was eighty releases behind it. Bumping the action alone changed nothing.
          version: v0.4.63
          # branchMustBeProtected reads main's protection settings, and GITHUB_TOKEN cannot:
          # `administration` is not a workflow permission scope (actionlint rejects it), so the API
          # answers 403 and the control reports the branch as non-compliant. Not "abstains":
          # it accused a branch whose require_code_owner_reviews reads true through the API.
          # This token is fine-grained, scoped to this repository, and carries Administration:read
          # and nothing else.
          github-token: ${{ secrets.PLUMBER_ADMIN_TOKEN }}
          verify-attestation: 'true'
          threshold: '100'
          upload-sarif: 'true'
          upload-artifacts: 'true'
          score-push: 'true'       # publish the score to the README badge (score.getplumber.io)
