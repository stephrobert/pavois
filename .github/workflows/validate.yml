name: validate

# Tier rapide de validation (L1-L4), automatique sur chaque push / PR.
# L1 intégrité du référentiel · L2 chargement · L3 traçabilité · L4 note.
# Le tier VM (L5 exécution, L6 round-trip remédiation) tourne hors CI (flotte Incus).

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pavois
        uses: actions/checkout@v4
        with:
          path: pavois

      # go.mod a `replace ... scankit => ../../scankit` -> on le checkoute en sœur.
      - name: Checkout scankit (dépendance locale)
        uses: actions/checkout@v4
        with:
          repository: stephrobert/scankit
          path: scankit

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Ruby présent (préinstallé sur ubuntu-latest)
        run: ruby --version

      # --quick : L1+L3+L4 (python), ruby -c, go build/vet/test.
      # Pas de cinc-auditor check ni oscap (lourds) -> tier VM hors CI.
      - name: Validation (tier rapide)
        working-directory: pavois
        run: tools/validate.sh --quick
