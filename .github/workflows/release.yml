name: Release

# Tag-triggered release (push a v* tag). Modelled on the getplumber/plumber release workflow:
# multi-arch Go build, SHA-256 checksums, SLSA build-provenance attestation, signed GitHub release.
# Actions are pinned by commit SHA (supply-chain hygiene). The binary lives in ./go (module pavois).

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  # Everything that decides whether this tag may become a release, before a single binary is built.
  # It is a separate job so the answer arrives in seconds and every other job hangs off it.
  guard:
    name: May this tag be released
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      # `tags: v*` is as wide as it looks: it matches v0.9.0-clean-room, a lab tag this repository
      # already carries, and it would have driven the whole release pipeline for it. A release is
      # not a thing you undo, so the tag has to look like a version before anything is built.
      - name: The tag is a release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*-*) ;;   # pre-release suffix, checked by the regex below
            v[0-9]*.[0-9]*.[0-9]*)   ;;
            *) echo "::error::$TAG is not a release tag; only vX.Y.Z (with an optional" \
                    "-rc.N / -beta.N / -alpha.N) publishes a release."; exit 1 ;;
          esac
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$'; then
            echo "::error::$TAG is not a release tag; only vX.Y.Z (with an optional" \
                 "-rc.N / -beta.N / -alpha.N) publishes a release."
            exit 1
          fi
          echo "$TAG is a release tag"

      # Five steps in the release job are gated on the repository being public, because GitHub
      # refuses attestations on a user-owned private repo and because a Cosign signature is written
      # to the public Rekor log. Gated, they SKIP: a tag pushed while the repo is private would
      # produce a perfectly green release with no provenance, no SBOM attestation and no signature,
      # and nothing would say so. The release would look identical and be worth much less.
      # So the pipeline refuses to start instead. The order is public first, tag second.
      - name: The repository can sign what it publishes
        if: ${{ github.event.repository.private }}
        run: |
          echo "::error::This repository is private, so build provenance, SBOM attestation and the" \
               "Cosign signature would all be skipped and the release would ship unsigned." \
               "Make the repository public, then push the tag again."
          exit 1

  # Render the .rb corpus ONCE (from the reference) and share it with the per-platform builds so
  # each binary embeds it (go:embed in internal/corpus) and ships self-contained. python3 is
  # preinstalled on ubuntu-24.04; a venv avoids PEP-668 system-pip friction.
  corpus:
    name: Render embedded corpus
    runs-on: ubuntu-24.04
    needs: guard
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout pavois
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render the rule corpus
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet --require-hashes -r .github/requirements/pyyaml.txt
          /tmp/venv/bin/python tools/gen.py render
          for f in docs/reference/pavois-content/*.yml; do
            /tmp/venv/bin/python tools/render_reference.py "$(basename "$f" .yml)"
          done

      - name: Upload corpus
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus
          path: profiles/linux
          # Default is 'warn': an empty upload succeeds and the DOWNLOAD fails, three steps
          # and one job away from the step that produced nothing.
          if-no-files-found: error

      # The per-OS reference is GENERATED (docs/reference/pavois-content/ is gitignored: the source
      # of truth is docs/reference/rules.yml, and `gen.py render` above just produced it). So the
      # build job cannot copy it out of its own checkout, and a first fix that tried to do exactly
      # that failed the release with `nothing matches docs/reference/pavois-content/*.yml`.
      # It travels the same way the corpus does, from the one job that renders it.
      - name: Upload the rendered reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference
          path: docs/reference/pavois-content
          if-no-files-found: error

  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    needs: corpus
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # scankit used to be private and consumed through a `replace` directive, which meant checking
      # it out as a sibling with a PAT. It is public since v0.1.0 and go.mod now pins v0.3.5 from
      # the module proxy, so the sibling checkout and SCANKIT_TOKEN are gone. The nested `path:` is
      # kept because every later step addresses pavois/go.
      - name: Checkout pavois
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pavois
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false   # a release build must not consume a cache a PR could poison (GHA-23)

      # Place the rendered corpus where //go:embed picks it up, so the binary is self-contained.
      - name: Download rendered corpus
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: corpus
          path: pavois/go/internal/corpus/profiles/linux

      # The corpus is not the only thing compiled in, and this step used to place only it.
      #
      # v0.1.2 shipped with an embedded corpus and an EMPTY reference: `scan` worked, and
      # `harden plan`, `rules`, `norms` and `oscal` all answered "this binary embeds none and none
      # is on disk". Every local check passed, because a local build runs `mise run embed:all`.
      # The same shape as v0.1.0, one floor down: compiled in, not shipped.
      #
      # The norm catalogue, the baseline identity, the audit ruleset and the kernel recipes are
      # COMMITTED under docs/reference/. The per-OS reference is not: it is rendered from rules.yml
      # and gitignored, so it arrives from the corpus job as an artifact.
      - name: Download the rendered reference
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reference
          path: pavois/docs/reference/pavois-content

      # The script is the SAME one `mise run embed:reference` calls, so this path and the local path
      # cannot drift apart again, and it fails loudly if a directory comes out empty.
      - name: Place the reference, the norm catalogue and the apply-time data
        working-directory: pavois
        run: bash tools/release/embed_reference.sh

      - name: Build binary
        working-directory: pavois/go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="pavois-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags="-s -w -X pavois/cmd.version=${VERSION}" -o "../../dist/${OUT}" .

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pavois-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  release:
    name: Create release
    runs-on: ubuntu-24.04
    needs: binaries
    permissions:
      contents: write       # create the release
      id-token: write        # SLSA provenance
      attestations: write    # build attestation
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout (for nfpm.yaml)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/
          merge-multiple: true

      - name: Setup Go (for nfpm)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false   # a release build must not consume a cache a PR could poison (GHA-23)

      - name: Build .deb / .rpm packages (nfpm)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
          NFPM="$(go env GOPATH)/bin/nfpm"
          VERSION="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            sed -e "s|\${ARCH}|${arch}|g" -e "s|\${VERSION}|${VERSION}|g" nfpm.yaml > "nfpm.${arch}.yaml"
            "$NFPM" pkg --config "nfpm.${arch}.yaml" --packager deb --target "dist/pavois_${VERSION}_${arch}.deb"
            "$NFPM" pkg --config "nfpm.${arch}.yaml" --packager rpm --target "dist/pavois-${VERSION}.${arch}.rpm"
          done

      # The exact set of files this release ships, written once and read three times: to compute
      # the checksums, to upload, and to verify what landed. It used to be a `pavois-*` glob, and
      # `merge-multiple: true` above puts EVERY artifact in dist/, including the SBOM under its
      # artifact name. So v0.1.4 shipped a stray pavois-release.cyclonedx.json, a byte-identical
      # duplicate of sbom.cdx.json, and listed it in checksums.txt as if a consumer should expect
      # it. A glob decides what ships; a list says it.
      - name: The asset list
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          {
            echo pavois-linux-amd64
            echo pavois-linux-arm64
            echo pavois-darwin-amd64
            echo pavois-darwin-arm64
            echo "pavois_${v}_amd64.deb"
            echo "pavois_${v}_arm64.deb"
            echo "pavois-${v}.amd64.rpm"
            echo "pavois-${v}.arm64.rpm"
          } > artifacts.txt
          rc=0
          while read -r f; do
            [ -s "$f" ] || { echo "::error::dist/$f is missing or empty"; rc=1; }
          done < artifacts.txt
          [ "$rc" -eq 0 ] || exit 1
          echo "$(wc -l < artifacts.txt) artifact(s) to ship"

      - name: Generate checksums
        working-directory: dist
        run: |
          set -euo pipefail
          xargs -a artifacts.txt sha256sum > checksums.txt
          cat checksums.txt

      # CycloneDX SBOM of the built tree: the component inventory an auditor asks for. Generated
      # unconditionally (it is a local scan, useful even before the repo is public) and attached to
      # the release below. upload-release-assets: false keeps this step from needing contents: write
      # on its own, we attach it via the single release step (least privilege).
      - name: Generate SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: go            # the Go module: SBOM reflects go.mod/go.sum, not the whole repo
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
          upload-release-assets: false

      # SLSA build-provenance attestation is unavailable for user-owned PRIVATE repos (GitHub
      # rejects it: "make this repository public"). Skipped while private; activates on public.
      - name: Attest build provenance
        id: attest
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/pavois-*

      # Bind the SBOM to the exact binaries, as a verifiable attestation (same private-repo gate as
      # the provenance). A consumer can then prove the inventory belongs to the artifact they hold.
      - name: Attest SBOM
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/pavois-*
          sbom-path: dist/sbom.cdx.json

      # Keyless Cosign signature of checksums.txt: one signature covers every artifact, since each
      # file's hash is in it. No key to manage (OIDC + Sigstore). Gated like the attestations: the
      # signature is logged to the public Rekor transparency log, which should not happen while the
      # repo is private. Verify with `cosign verify-blob --bundle` (see the verify workflow).
      - name: Install Cosign
        if: ${{ !github.event.repository.private }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums (keyless)
        if: ${{ !github.event.repository.private }}
        working-directory: dist
        run: cosign sign-blob --yes --bundle checksums.txt.cosign.bundle checksums.txt

      - name: Copy provenance into dist
        if: ${{ !github.event.repository.private && steps.attest.outputs.bundle-path != '' }}
        env:
          # Never interpolate a step output directly into run: (GHA-14, zizmor template-injection);
          # bind it to an env var and let the shell read it, so no attacker-shaped value can break out.
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/provenance.intoto.jsonl

      # Extract this version's CHANGELOG section. The preflight runs the same extraction and
      # refuses a tag whose section is missing or nearly empty, so by the time this runs the body
      # is known to exist: this step formats it, it does not decide anything.
      - name: Build the release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?" v { inside = 1; next }
            inside && (/^## / || /^\\[[^]]+\\]:/) { exit }
            inside { print }' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"; exit 1
          fi
          {
            echo
            echo "---"
            echo
            echo "Verify what you downloaded, without any access to this repository:"
            echo
            echo '```bash'
            echo "sha256sum --ignore-missing --check checksums.txt"
            echo "gh attestation verify pavois-linux-amd64 --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >> release-notes.md
          echo "release notes: $(wc -l < release-notes.md) lines"

      # Assembled as a DRAFT, published only once every asset is present and verified.
      #
      # That ordering is not a nicety: it is what made the v0.1.4 upload failure harmless. Three
      # consecutive network errors left a draft nobody could see, while v0.1.3 stayed the current
      # release and every download link kept working. Publishing first and uploading after would
      # have put a half-empty release in front of users instead.
      #
      # The release body is the CHANGELOG section, not a generated list of merged pull requests.
      # Those list the plumbing: "bump the actions group", "skip Plumber on Dependabot". A reader
      # arriving at a release wants to know what the tool DOES, and that is written by hand, once.
      - name: Create the release as a draft
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; reusing it (this is a re-run)"
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file release-notes.md
          fi

      # ONE AT A TIME, with retries, and resumable.
      #
      # The action this replaces uploaded twelve files in parallel and deleted the existing asset
      # before writing each one. On v0.1.4 it answered `Error creating asset temp dir`, then
      # `Error saving asset`, then `Headers Timeout Error` on a 20 MB binary: three failures, and
      # every re-run threw away the progress of the one before it. `--clobber` on a sequential loop
      # re-sends only what is missing, so a retry moves forward instead of starting over.
      - name: Upload the assets
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The signature and the provenance exist only when the repository is public, which the
          # guard job has already established; listed here so a missing one is visible rather than
          # silently skipped by a glob.
          for extra in checksums.txt checksums.txt.cosign.bundle sbom.cdx.json provenance.intoto.jsonl; do
            [ -s "$extra" ] && echo "$extra" >> artifacts.txt
          done
          while read -r f; do
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$f" --clobber; then
                echo "uploaded $f"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::could not upload $f after 3 attempts; the release stays a draft"
                exit 1
              fi
              echo "upload of $f failed, retrying ($attempt/3)"
              sleep "$((attempt * 10))"
            done
          done < artifacts.txt

      # Compared against what is on disk, by name AND by size. A truncated upload reports success
      # and leaves a shorter asset, which no name check would see. Nothing about this release
      # becomes visible to anyone until it passes.
      - name: Every asset landed, at its full size
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name) \(.size)"' | sort > published.txt
          while read -r f; do
            want=$(stat -c%s "$f")
            got=$(awk -v n="$f" '$1 == n {print $2}' published.txt)
            if [ -z "$got" ]; then
              echo "::error::$f is not on the release"; exit 1
            elif [ "$got" != "$want" ]; then
              echo "::error::$f is $got bytes on the release, $want on disk"; exit 1
            fi
          done < artifacts.txt
          echo "$(wc -l < artifacts.txt) asset(s) verified against dist/"

      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest

  # The site advertises ONE version, and from here it is this one.
  #
  # This job is the whole of #329. site-deploy.yml declares `on: release: published`, and that
  # trigger can never fire: the release above is created with the default GITHUB_TOKEN, and GitHub
  # starts no workflow from an event that token produced. So the site kept serving the previous
  # version until somebody dispatched the deploy by hand, which is what happened for 0.1.5.
  # A call involves no trigger at all. It is the same run, so the rule does not apply to it.
  #
  # It is a CALL and not a copy. That deploy is fifteen steps ending in an S3 sync and a CloudFront
  # invalidation, in front of eight checks that refuse to publish a broken site. A second copy of
  # it in this file would be a second thing to keep correct, and this repository has already paid
  # for that shape of mistake: the embed copies now live in exactly one script for the same reason.
  #
  # It runs at the tag, so the site is built from the commit whose install.ts names this version,
  # and site-deploy's own gate then checks that version is downloadable before touching the bucket.
  # The AWS role has to trust the tag ref for this to work: tools/aws/site-deploy-role.sh.
  #
  # KNOWN FINDING, and it is a tool disagreement rather than a decision. zizmor's `self-repository`
  # audit wants `uses: $/...`, the form GitHub added in July 2026, which is not subject to runtime
  # filesystem state. No released actionlint understands it: v1.7.12 is the latest (2026-03-30) and
  # rejects it as not matching either accepted format. Measured, both ways:
  #
  #     ./            actionlint accepts   zizmor refuses (self-repository)
  #     $/            actionlint refuses   zizmor accepts
  #     owner/repo@main  actionlint accepts  zizmor refuses (unpinned-uses)
  #
  # No form satisfies both gates, so this is not a choice between a safe line and an unsafe one: it
  # is a linter older than the platform feature the other linter asks for. `actionlint + zizmor +
  # poutine` is a REQUIRED status check on main, so leaving the finding visible does not mean
  # living with a red mark, it means the pull request can only land by bypassing the gate, which is
  # how a gate stops meaning anything. It is acquitted in .github/zizmor.yml, targeted by rule and
  # by file, with the measurement written next to it. Delete that entry and switch this line to
  # `$/` the day actionlint ships a release that parses it: that form is genuinely the safer one.
  site:
    name: Publish the site this release advertises
    needs: release
    permissions:
      contents: read
      id-token: write   # exchanged for the AWS role through OIDC, no stored key
    uses: ./.github/workflows/site-deploy.yml
