name: Release

# Tag-triggered release (push a v* tag). Modelled on the getplumber/plumber release workflow:
# multi-arch Go build, SHA-256 checksums, SLSA build-provenance attestation, signed GitHub release.
# Actions are pinned by commit SHA (supply-chain hygiene). The binary lives in ./go (module pavois).

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  # Render the .rb corpus ONCE (from the reference) and share it with the per-platform builds so
  # each binary embeds it (go:embed in internal/corpus) and ships self-contained. python3 is
  # preinstalled on ubuntu-24.04; a venv avoids PEP-668 system-pip friction.
  corpus:
    name: Render embedded corpus
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout pavois
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render the rule corpus
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pyyaml
          /tmp/venv/bin/python tools/gen.py render
          for f in docs/reference/pavois-content/*.yml; do
            /tmp/venv/bin/python tools/render_reference.py "$(basename "$f" .yml)"
          done

      - name: Upload corpus
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus
          path: profiles/linux

  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    needs: corpus
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # go.mod has `replace github.com/stephrobert/scankit => ../../scankit`, so the private
      # scankit repo is checked out as a sibling: from pavois/go/go.mod, ../../scankit resolves to
      # $GITHUB_WORKSPACE/scankit. SCANKIT_TOKEN is a repo secret (PAT/App with read on scankit).
      - name: Checkout pavois
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pavois
          persist-credentials: false

      - name: Checkout scankit (private dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stephrobert/scankit
          token: ${{ secrets.SCANKIT_TOKEN }}
          path: scankit
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false   # a release build must not consume a cache a PR could poison (GHA-23)

      # Place the rendered corpus where //go:embed picks it up, so the binary is self-contained.
      - name: Download rendered corpus
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: corpus
          path: pavois/go/internal/corpus/profiles/linux

      - name: Build binary
        working-directory: pavois/go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="pavois-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags="-s -w -X pavois/cmd.version=${VERSION}" -o "../../dist/${OUT}" .

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pavois-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  release:
    name: Create release
    runs-on: ubuntu-24.04
    needs: binaries
    permissions:
      contents: write       # create the release
      id-token: write        # SLSA provenance
      attestations: write    # build attestation
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout (for nfpm.yaml)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/
          merge-multiple: true

      - name: Setup Go (for nfpm)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false   # a release build must not consume a cache a PR could poison (GHA-23)

      - name: Build .deb / .rpm packages (nfpm)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
          NFPM="$(go env GOPATH)/bin/nfpm"
          VERSION="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            sed -e "s|\${ARCH}|${arch}|g" -e "s|\${VERSION}|${VERSION}|g" nfpm.yaml > "nfpm.${arch}.yaml"
            "$NFPM" pkg --config "nfpm.${arch}.yaml" --packager deb --target "dist/pavois_${VERSION}_${arch}.deb"
            "$NFPM" pkg --config "nfpm.${arch}.yaml" --packager rpm --target "dist/pavois-${VERSION}.${arch}.rpm"
          done

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum pavois-* pavois_* > checksums.txt
          cat checksums.txt

      # CycloneDX SBOM of the built tree: the component inventory an auditor asks for. Generated
      # unconditionally (it is a local scan, useful even before the repo is public) and attached to
      # the release below. upload-release-assets: false keeps this step from needing contents: write
      # on its own, we attach it via the single release step (least privilege).
      - name: Generate SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: go            # the Go module: SBOM reflects go.mod/go.sum, not the whole repo
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
          upload-release-assets: false

      # SLSA build-provenance attestation is unavailable for user-owned PRIVATE repos (GitHub
      # rejects it: "make this repository public"). Skipped while private; activates on public.
      - name: Attest build provenance
        id: attest
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/pavois-*

      # Bind the SBOM to the exact binaries, as a verifiable attestation (same private-repo gate as
      # the provenance). A consumer can then prove the inventory belongs to the artifact they hold.
      - name: Attest SBOM
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/pavois-*
          sbom-path: dist/sbom.cdx.json

      # Keyless Cosign signature of checksums.txt: one signature covers every artifact, since each
      # file's hash is in it. No key to manage (OIDC + Sigstore). Gated like the attestations: the
      # signature is logged to the public Rekor transparency log, which should not happen while the
      # repo is private. Verify with `cosign verify-blob --bundle` (see the verify workflow).
      - name: Install Cosign
        if: ${{ !github.event.repository.private }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums (keyless)
        if: ${{ !github.event.repository.private }}
        working-directory: dist
        run: cosign sign-blob --yes --bundle checksums.txt.cosign.bundle checksums.txt

      - name: Copy provenance into dist
        if: ${{ !github.event.repository.private && steps.attest.outputs.bundle-path != '' }}
        env:
          # Never interpolate a step output directly into run: (GHA-14, zizmor template-injection);
          # bind it to an env var and let the shell read it, so no attacker-shaped value can break out.
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/provenance.intoto.jsonl

      - name: Create release with assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/pavois-*
            dist/pavois_*.deb
            dist/checksums.txt
            dist/checksums.txt.cosign.bundle
            dist/sbom.cdx.json
            dist/provenance.intoto.jsonl
