name: Rule base

# The guards that keep a dangerous remediation from being armed automatically, and keep the
# generated corpus honest. They existed already, in the local pre-push hook, which means they were
# enforced only for whoever ran it: `--no-verify` skips it, a fresh clone that never ran
# `pre-commit install` does not have it, and an edit made in the GitHub web UI never sees it.
#
# The product principle at stake is worth stating: Pavois prefers an explicit FAIL over a dangerous
# PASS. A one-word edit of `remediation_class` in a 40 000-line YAML is all it takes to arm a
# remediation that chowns setgid binaries, freezes module loading under a firewall that needs
# modules, or starts fapolicyd without a trust database. None of those is caught by a unit test.
#
# gen:verify matters for a reason this project learned the hard way: the fix went into rules.yml,
# the generated corpus still said `auto`, and the next run re-applied the dangerous remediation.
# Source and generated output agreeing is the thing to check, not the source alone.

on:
  push:
    branches: [main]
    paths:
      - 'docs/reference/rules.yml'
      - 'docs/reference/pavois-content/**'
      - 'docs/reference/prose/**'
      - 'tools/gen.py'
      - 'tools/lint_prose_coverage.py'
      - 'tools/lint_never_auto.py'
      - 'tools/lint_rules.py'
      - 'tools/validate_mappings.py'
      - 'mise.toml'
      - '.github/workflows/rules.yml'
  # No paths filter on the events that gate a merge: "Never-auto and corpus integrity" is a
  # REQUIRED check, and a required check that is filtered out reports nothing rather than
  # "skipped", so GitHub waits for a result that never comes. See go.yml for the full story.
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  guards:
    name: Never-auto and corpus integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.2.23
          install: true
          cache: true

      # No remediation known to be able to break a system may belong to `--enable auto`.
      - name: A dangerous remediation has not drifted back to automatic
        run: mise run lint:never-auto

      # The per-OS corpus and the .rb profiles are DERIVED and gitignored, so a fresh clone has
      # neither: gen:verify alone fails with "nothing to verify". Generate first, then verify, then
      # render. Comparing a corpus to the source it was just generated from is tautological on its
      # own; what these three steps actually catch is a generator that crashes, that is not
      # deterministic, or that emits a corpus the renderer cannot turn into valid Ruby. That last
      # one matters: the renderer now rewrites shell-keyword commands, and a quoting mistake there
      # would silently produce controls that measure nothing.
      - name: Generate the per-OS corpus
        run: mise run gen

      - name: The generated corpus matches its source
        run: mise run gen:verify

      - name: The .rb corpus renders
        run: mise run render

      # Runs AFTER render, because it reads the rendered corpus: that is what actually executes.
      - name: No control loses its privileges under --sudo
        run: mise run lint:shell-first-word

      - name: Rule-base lints
        run: mise run lint:rules

      # Applicability is declared now (#324). Two things to keep true: the 28 `applies_if` blocks
      # are well formed, which nothing read before (tools/applies_if.py only validated itself), and
      # the 90 hand-written `only_if` guards left do not become 91 while they are being migrated.
      #
      # Placed next to the other rule-base coherence lints rather than appended at the end of the
      # job, because another open pull request appends there and two additions at one anchor is a
      # conflict for no reason. tools/validate_prs.sh found that by merging the branches together.
      - name: Applicability is declared, and the old way does not grow back
        run: mise run lint:applies-if

      - name: And that lint still bites
        run: mise run lint:applies-if:test

      # Every norm tag points at a requirement that exists in the published standard.
      - name: Mappings are references, not inventions
        run: mise run validate:mappings

      # A control with no page is a control the site cannot ship. This used to be discovered by
      # site-deploy, on main, after the merge: the rule base gained growth-audit-trail-unbounded,
      # the site build refused it, and the deploy stayed red until six paragraphs were written.
      # The check is offline and reads two directories, so it belongs on the PR that adds the
      # control, not on the pipeline that publishes it.
      - name: Every live control has authored bilingual prose
        run: mise run lint:prose

      - name: And that check still bites
        run: mise run lint:prose:test

      # The fiches under site/src/content/rules/ are a PROJECTION of the rule base, and they are
      # tracked so the Astro build works from a plain clone. Nothing compared them to their source:
      # site:verify depends on gen:pages, so it regenerates them and then checks the regenerated
      # copy against itself. Three merged pull requests changed what every audit control executes
      # and the 137 fiches in git kept advertising the previous command, for as long as nobody read
      # them in a diff. The deploy rebuilds them, so the published site was never wrong, which is
      # exactly why this went unnoticed.
      #
      # This step is the non-tautological half: regenerate, then ask git whether the tracked files
      # moved. It runs here rather than in the pre-push hook because it costs 30 seconds and the
      # only way to reach it is to change the rule base, which is what this workflow triggers on.
      - name: The site's fiches match the rule base they are generated from
        run: |
          mise run gen:pages
          if ! git diff --quiet -- site/src/content/rules/; then
            echo "::error::the rule fiches in git are stale; run 'mise run gen:pages' and commit the result"
            git diff --stat -- site/src/content/rules/
            exit 1
          fi
