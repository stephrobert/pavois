name: Go

# Quality gate for the pavois Go binary (module in ./go): formatting, vet, build, race-tested
# units, golangci-lint and govulncheck. Mirrors .pre-commit-config.yaml and the
# go-production-engineer standard. Actions pinned by commit SHA; tools pinned by version.

# The release paths are in the filter because the embed check below has two halves and either one
# can break it: a new //go:embed under go/, or a copy step removed from the release build. A filter
# that watched only go/** would pass the day somebody deleted a line from embed_reference.sh.
#
# The list is written twice rather than shared through a YAML anchor: GitHub Actions does not
# resolve anchors, although actionlint does, so a workflow that uses one parses locally and is
# rejected by the runner.
on:
  push:
    branches: [main]
    paths:
      - 'go/**'
      - '.github/workflows/go.yml'
      - '.github/workflows/release.yml'
      - '.golangci.yml'
      - 'tools/lint_embed_release.py'
      - 'tools/release/embed_reference.sh'
  pull_request:
    paths:
      - 'go/**'
      - '.github/workflows/go.yml'
      - '.github/workflows/release.yml'
      - '.golangci.yml'
      - 'tools/lint_embed_release.py'
      - 'tools/release/embed_reference.sh'
  workflow_dispatch:

permissions: {}

jobs:
  quality:
    name: Build, test, lint, vuln-scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout pavois
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pavois
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: pavois/go/go.sum

      - name: gofmt
        working-directory: pavois/go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        working-directory: pavois/go
        run: go vet ./...

      - name: go build
        working-directory: pavois/go
        run: go build ./...

      # A build says nothing about what the build EMBEDS. An empty //go:embed directory compiles
      # cleanly and produces a binary that answers "this binary embeds none and none is on disk" to
      # the first command a user runs, which is exactly what 0.1.2 shipped: the release workflow
      # filled the corpus and left the three directories added in that same release holding their
      # .keep. This rule fails when an embed directory git holds empty is not filled by the release
      # path, and it runs HERE rather than only at release time, so the answer arrives on the pull
      # request that adds the embed.
      - name: every embed directory is filled by the release build
        working-directory: pavois
        run: python3 tools/lint_embed_release.py

      - name: go test (race)
        working-directory: pavois/go
        run: go test -race ./...

      # Mutation fuzzing lives in fuzz.yml, nightly, NOT here (#224): it was 2m34 of a 3m43 job,
      # 69% of the wall-clock, in front of everything that tells a contributor whether their change
      # is sound. `go test -race` above still replays every seed corpus, so every crasher ever
      # found remains a permanent regression test on this path.

      # A green suite says nothing is broken. It does not say anything is GUARDED: a test can
      # stop biting when a refactor moves an assertion or a case becomes unreachable, and nothing
      # goes red the day it happens. Each declaration in tools/falsify.yml neuters one guard on a
      # COPY of the module and demands its test go red; a mutant that fails to compile is reported
      # VOID rather than as a pass, because every test failing is not evidence of a guard.
      - name: falsify (the declared guards must still bite)
        working-directory: pavois
        run: |
          python3 -m pip install --no-cache-dir --quiet --require-hashes \
            -r .github/requirements/pyyaml.txt
          python3 tools/falsify.py

      # The linter binary is CACHED, not rebuilt. Compiling golangci-lint from source on every
      # run cost 94s of a 3m36 job (measured, run 33844975089): more than the tests, the vet and
      # the falsification harness put together, to obtain a binary that is identical every time.
      # The key carries the version, so a bump misses the cache exactly once, on purpose.
      - name: Cache golangci-lint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-v2.12.2-${{ runner.os }}

      - name: golangci-lint
        working-directory: pavois/go
        run: |
          if [ ! -x "$(go env GOPATH)/bin/golangci-lint" ]; then
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          fi
          "$(go env GOPATH)/bin/golangci-lint" run ./...

      - name: govulncheck
        working-directory: pavois/go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      # The site tells readers the OSCAL export is conformant assessment-results, which is a claim
      # about a schema a third party can run. `mise run oscal:verify` has existed for that since the
      # export landed, and ran nowhere: it needed an OSCAL_SAMPLE nobody set, so it was a task a
      # maintainer had to remember. A promise kept by memory is a promise about to break, so the
      # export is now checked against the NIST 1.1.2 schema on every push, with the anonymized
      # fixture the site's own sample report is built from.
      # check-jsonschema, not plain jsonschema: the NIST schema uses \p classes the latter dies on.
      - name: OSCAL export is still valid assessment-results
        working-directory: pavois
        run: |
          go build -C go -o pavois .
          curl -sSL --retry 3 -o /tmp/oscal-schema.json \
            https://github.com/usnistgov/OSCAL/releases/download/v1.1.2/oscal_assessment-results_schema.json
          tmp=$(mktemp -d)
          cp docs/examples/after.json "$tmp/sample.json"
          ./go/pavois scan local --from "$tmp/sample.json" --out "$tmp" --format oscal > "$tmp/out.json"
          pipx run check-jsonschema --schemafile /tmp/oscal-schema.json "$tmp/out.json"
