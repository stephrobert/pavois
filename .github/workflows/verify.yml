name: Verify release

# Consumer-side proof that a published release is authentic: it downloads the release assets and
# verifies, WITHOUT any special access to the repo, that (1) the binaries carry a SLSA build
# provenance from this repo's release workflow, and (2) checksums.txt is signed by that same
# workflow via keyless Cosign. This is the other half of the supply chain: the release workflow
# PRODUCES the attestations, this one proves a third party can CHECK them. Manual trigger, so it
# runs after the release assets exist (no race with the publish).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (e.g. v0.2.0)'
        required: true

permissions: {}

jobs:
  verify:
    name: Verify provenance and signature
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read      # download release assets
    env:
      REPO: stephrobert/pavois
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p verify && cd verify
          gh release download "$TAG" --repo "$REPO" \
            --pattern 'pavois-*' --pattern 'checksums.txt' --pattern 'checksums.txt.cosign.bundle'

      - name: Verify the checksums match the binaries
        working-directory: verify
        run: sha256sum --ignore-missing --check checksums.txt

      - name: Verify SLSA build provenance (native GitHub attestation)
        working-directory: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Every binary must carry a provenance from THIS repo. --owner pins who signed it.
        run: |
          for bin in pavois-*; do
            echo "::group::provenance $bin"
            gh attestation verify "$bin" --repo "$REPO"
            echo "::endgroup::"
          done

      - name: Verify the Cosign signature on checksums (keyless)
        working-directory: verify
        # Both flags are mandatory: without them cosign verify-blob accepts ANY identity.
        # --certificate-identity-regexp pins WHICH workflow signed (release.yml), the issuer pins WHO.
        run: |
          cosign verify-blob \
            --bundle checksums.txt.cosign.bundle \
            --certificate-identity-regexp "https://github.com/${REPO}/.github/workflows/release.yml@.*" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            checksums.txt
