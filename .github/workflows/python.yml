name: Python

# Quality gate for the offline Python tooling (tools/): ruff lint + format check and
# bandit security scan. Config lives in pyproject.toml ([tool.ruff], [tool.bandit]). Mirrors
# .pre-commit-config.yaml. Actions pinned by commit SHA; tools pinned by version.
# NB: test-vms/ is gitignored (lab tooling, not published), so it is not linted in CI.

on:
  push:
    branches: [main]
    paths: ['tools/**', 'pyproject.toml', '.github/workflows/python.yml']
  pull_request:
    paths: ['tools/**', 'pyproject.toml', '.github/workflows/python.yml']
  workflow_dispatch:

permissions: {}

jobs:
  quality:
    name: ruff + bandit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install ruff + bandit (pinned)
        run: pip install --no-cache-dir ruff==0.14.9 'bandit[toml]==1.9.2'

      - name: ruff (lint)
        run: ruff check tools/

      - name: ruff (format check)
        run: ruff format --check tools/

      - name: bandit (security)
        run: bandit -r tools/ -c pyproject.toml -q
