name: Python

# Quality gate for the offline Python tooling (tools/): ruff lint + format check and
# bandit security scan. Config lives in pyproject.toml ([tool.ruff], [tool.bandit]). Mirrors
# .pre-commit-config.yaml. Actions pinned by commit SHA; tools pinned by version.
# NB: test-vms/ is gitignored (lab tooling, not published), so it is not linted in CI.

on:
  push:
    branches: [main]
    paths: ['tools/**', 'pyproject.toml', '.github/workflows/python.yml']
  # No paths filter on the events that gate a merge: "ruff + bandit" is a REQUIRED check, and a
  # required check that is filtered out reports nothing at all rather than "skipped". GitHub then
  # waits forever. See the same comment in go.yml for what that cost.
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  quality:
    name: ruff + bandit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install ruff + bandit (pinned)
        run: pip install --no-cache-dir --require-hashes -r .github/requirements/lint.txt

      - name: ruff (lint)
        run: ruff check tools/

      - name: ruff (format check)
        run: ruff format --check tools/

      - name: bandit (security)
        run: bandit -r tools/ -c pyproject.toml -q
