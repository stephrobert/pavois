name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 1'

permissions: {}

jobs:
  analysis:
    name: Scorecard Analysis
    # Scorecard needs a public repository (commit-graph API + result publication).
    # Skips while the repo is private (pre-launch); activates automatically once public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    # The privileged token lives in this protected environment, restricted to main. This workflow
    # never runs on `pull_request`, so the token is unreachable from a fork. Same model as
    # plumber.yml and as dsoxlab, the best-scoring repository in the fleet.
    environment: security
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Branch-Protection read as `n/e` without this, and an unevaluated control is not a zero:
          # it drops out of the average entirely, so the whole score describes a repository whose
          # protection nobody measured. Reading a branch's protection needs Administration:read,
          # which GITHUB_TOKEN cannot carry (`administration` is not a workflow permission scope).
          # The same fine-grained token Plumber uses, scoped to this repository and nothing else.
          repo_token: ${{ secrets.PLUMBER_ADMIN_TOKEN }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
