name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 1'

permissions: {}

jobs:
  analysis:
    name: Scorecard Analysis
    # Scorecard needs a public repository (commit-graph API + result publication).
    # Skips while the repo is private (pre-launch); activates automatically once public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # NO repo_token, deliberately, and this is a loss worth naming rather than hiding.
          #
          # Branch-Protection reads `n/e` without one, and not-evaluated is not a zero: the control
          # drops out of the average, so the published score describes a repository whose protection
          # nobody measured, on the control that weighs 10.
          #
          # Passing PLUMBER_ADMIN_TOKEN was tried and failed with `401 Bad credentials` on the very
          # first call, GET /repos/stephrobert/pavois. That token is scoped to Administration:Read
          # and nothing else, which is exactly right for Plumber's one governance check and far too
          # narrow for Scorecard, which reads commits, releases, workflows and branches. dsoxlab
          # runs this same workflow successfully with a token of its own, so the montage is sound
          # and only the credential is wrong.
          #
          # To close it: create a token with the read access ossf/scorecard-action documents, put it
          # in a secret of its own, and restore `repo_token` plus `environment: security` here. Do
          # not widen PLUMBER_ADMIN_TOKEN: a token that can read everything is no longer the
          # narrow, auditable thing it was created to be.

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
