name: Dependency review

# Blocks a PR that introduces a dependency with a known HIGH/CRITICAL vulnerability or a
# disallowed license. Uses the GitHub dependency graph (free on public repos; needs GitHub
# Advanced Security on private) — skips while private.

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  review:
    name: Review dependency changes
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # AGPL/GPL copyleft would force-relicense the Apache-2.0 project — deny by default.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
