name: Dependency review

# Blocks a PR that introduces a dependency with a known HIGH/CRITICAL vulnerability or a
# disallowed license. Uses the GitHub dependency graph (free on public repos; needs GitHub
# Advanced Security on private): skips while private.

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  review:
    name: Review dependency changes
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # AGPL/GPL copyleft would force-relicense the Apache-2.0 project: deny by default.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
