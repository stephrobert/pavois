name: ✨ Feature request
description: Suggest a capability for the scanner, harden flow, report, CLI or site.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [Feature status](https://pavois.dev/en/handbook/feature-status/) first: it may already be
        delivered, partial or on the roadmap. For rules, use the "Rule proposal" template instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? What's the use case?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Pavois do? CLI shape, output, behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
