name: 📐 Rule proposal / improvement
description: Propose a new control or deepen an existing one (the core contribution).
labels: ["rule"]
body:
  - type: markdown
    attributes:
      value: |
        The rule library is the heart of Pavois. A control must audit the **effective configuration**
        (resolved runtime state), not a config file. See CONTRIBUTING.md → "Where to help".
  - type: input
    id: id
    attributes:
      label: Proposed control id
      description: Standard-neutral `domain-object` slug.
      placeholder: "ssh-permitrootlogin"
    validations:
      required: true
  - type: input
    id: domain
    attributes:
      label: Domain
      placeholder: "SSH, Kernel, Accounts, Firewall, Logging, Time-sync, MAC, …"
    validations:
      required: true
  - type: textarea
    id: effective-check
    attributes:
      label: Effective-config check
      description: How the resolved state is read — `sshd -T`, `sysctl`, `systemctl show`, `auditctl`, `nginx -T`… NOT the file.
      placeholder: "sshd -T | grep permitrootlogin  →  must be 'no'"
    validations:
      required: true
  - type: textarea
    id: mappings
    attributes:
      label: Standard mappings (with sources)
      description: One control, N standards. Give the reference number for each standard and where it comes from.
      placeholder: |
        cis: 5.2.10 (CIS Ubuntu 24.04 v1.0.0)
        bp28: R36 (ANSSI BP-028 v2.0)
        pci-dss: 2.2.4
    validations:
      required: true
  - type: input
    id: oses
    attributes:
      label: Applicable OSes
      placeholder: "debian12, ubuntu2404, rhel9, … (or 'all Linux')"
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [high, medium, low]
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Principles
      options:
        - label: This audits the EFFECTIVE config, not a file.
          required: true
        - label: The standard references are sourced (not from memory).
          required: true
