name: 🐛 Bug report
description: Something in the scanner, harden flow, report or CLI behaves incorrectly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For **security** issues use private disclosure (see SECURITY.md), not this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected vs what actually happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command(s) and context. Redact any secrets, real hostnames or IPs.
      placeholder: |
        1. pavois scan local --profile linux/ubuntu2404 --sudo
        2. …
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pavois version
      description: Output of `pavois version`.
      placeholder: "vX.Y.Z (or commit sha)"
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options: [native (cinc-auditor), docker, not sure]
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target OS / transport
      description: Audited target and how you reached it.
      placeholder: "Ubuntu 24.04 over ssh:// (or local://, docker://)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output / logs
      description: Paste the error or the relevant report excerpt. Redact secrets.
      render: shell
