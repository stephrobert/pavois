version: 2

# Supply-chain quarantine, on the model pepin arrived at (ADR-0021 there).
#
# A cooldown lets a fresh release show its defects before it is adopted. Applied UNIFORMLY it also
# delays security fixes, and that is not theoretical: pepin's scankit v0.2.3 bump closed a silent
# exfiltration and waited out the full quarantine, because no CVE advisory existed to distinguish it
# from an ordinary version bump. Dependabot only exempts what it can SEE is a security update.
#
# So the quarantine is split. Patch releases wait one day: that is where security fixes land, and it
# is also the bump whose regression is cheapest to revert. Everything else waits a week.
#
# This is the second line, not the first: actions are pinned by commit SHA, the Trivy gate runs in
# deps.yml, and TruffleHog reads the whole history on every push.
updates:
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-patch-days: 1
    open-pull-requests-limit: 10
    groups:
      # Without `applies-to`, a group covers ONLY version updates, and security updates then
      # arrive one per pull request. With a dozen open alerts that is a dozen pull requests the
      # same morning, and a bot that floods is a bot people filter. Two groups per ecosystem is
      # the ceiling: one for the weekly bump, one for whatever security opens.
      go-modules:
        applies-to: version-updates
        patterns: ["*"]
      go-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-patch-days: 1
    open-pull-requests-limit: 10
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # The Python tooling (tools/, test-vms/, the norm-studio MCP). Added late, and the reason is worth
  # keeping: uv.lock was matched by a blanket `*.lock` in .gitignore and had never been committed, so
  # there was nothing here for Dependabot OR the Trivy gate to read. It was the one dependency set in
  # this repository that nothing watched, and its first scan (#418) reported 17 fixable HIGH/CRITICAL
  # advisories (pyjwt, authlib, cryptography, certifi, anyio, dnspython, joserfc). Tracking the file
  # made it visible; this entry is what keeps it from silting up again.
  #
  # `uv`, not `pip`: the uv ecosystem rewrites the constraint in pyproject.toml AND re-resolves
  # uv.lock, where pip updates pyproject.toml and leaves the lockfile stale. Never both on the same
  # directory, which opens duplicate pull requests for every bump.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      # Same split as gomod and npm, and uv supports it: GitHub's cooldown table lists uv as
      # supporting default-days AND the semver-bump options, unlike github-actions below.
      default-days: 7
      semver-patch-days: 1
    open-pull-requests-limit: 10
    groups:
      uv-packages:
        applies-to: version-updates
        patterns: ["*"]
      uv-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # Keeps the SHA-pinned actions fresh (Dependabot bumps the pinned SHA + comment). Pinning by SHA
  # is what makes an action trustworthy and is also what makes it rot: without this, the digest ages
  # with its CVEs in silence. Learned the expensive way here: PR #255 carried eight of these bumps,
  # was closed unmerged, and closing a Dependabot PR tells it to stop offering that version. Plumber
  # then sat twenty-three releases behind until someone looked.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      # No semver-patch-days here: Dependabot does not support it for github-actions, and answers
      # "The property '#/updates/N/cooldown/semver-patch-days' is not supported for the package
      # ecosystem 'github-actions'" (N being this entry's index, which moves when one is inserted
      # above). pepin's config omits it for the same reason; copying it onto every ecosystem was
      # over-copying a model rather than reading it, and GitHub's cooldown table is where to read
      # it: github-actions supports default-days only, where gomod, npm and uv support all four.
      default-days: 7
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

# Deliberately NOT tracked: docker.
#
# pepin tracks it because it ships an image whose base is pinned by digest, and a pinned digest ages
# with its CVEs unless something watches it. The only Dockerfile here is
# targets/sshd-dropin/Dockerfile, a deliberately misconfigured scan target built on `debian:12-slim`,
# a mutable tag rather than a digest. It is rebuilt fresh, it ships nowhere, and its whole purpose is
# to be non-compliant. Tracking it would produce pull requests nobody should act on, which is how a
# bot earns the right to be ignored.
