rules:
  account-accounts-no-uid-except-zero:
    check:
    - 'describe command(''awk -F: \''($3==0 && $1!="root"){print $1}\'' /etc/passwd'')
      do'
    - '  its(''stdout.strip'') { should eq '''' }'
    - end
    domain: Accounts
    evidence_type: inventory-state
    impact: 1.0
    levels:
      cis: '1'
    norms:
      cis:
      - 5.4.2.1
      - 8.2.1
      nist:
      - 3.1.1
      - AC-6(5)
      - IA-2
      - IA-4(b)
      pci-dss: Req-8.5
    reboot_survivable: 'yes'
    remediation:
      command: '# List accounts with uid 0 other than root; remove/fix each ONLY after
        confirming it is rogue.

        awk -F: ''($3==0 && $1!="root"){print $1}'' /etc/passwd

        # for a confirmed rogue account: userdel <name>   (irreversible — verify it
        is not legitimate)

        '
      reason: deleting an account is irreversible — a human must confirm it is rogue
      resource: manual
    severity: critical
    socle: SOCLE-CLD-IAM-001
    ssg: accounts_no_uid_except_zero
    title: Verify Only Root Has UID 0
  account-accounts-password-all-shadowed:
    check:
    - 'describe command(''awk -F: \''($2!="x" && $2!="*" && $2!="!"){print $1}\''
      /etc/passwd'') do'
    - '  its(''stdout.strip'') { should eq '''' }'
    - end
    domain: Accounts
    evidence_type: inventory-state
    impact: 1.0
    levels:
      cis: '1'
    norms:
      cis:
      - 7.2.1
      - 8.3.2
      nist:
      - 3.5.10
      - CM-6(a)
      - IA-5(h)
      pci-dss: Req-8.2.1
    reboot_survivable: 'yes'
    remediation:
      command: 'grep -E ''^[^:]+:[^:!*x]'' /etc/passwd   # accounts with a hash still
        in /etc/passwd

        pwconv   # migrate them to /etc/shadow

        '
      reason: moving passwords to /etc/shadow with pwconv is safe but verify no app
        reads /etc/passwd hashes
      resource: manual
    severity: critical
    socle: SOCLE-CLD-IAM-002
    ssg: accounts_password_all_shadowed
    title: Verify All Account Password Hashes are Shadowed
  account-accounts-root-gid-zero:
    check:
    - 'describe command(''awk -F: \''($1=="root" && $4!=0){print}\'' /etc/passwd'')
      do'
    - '  its(''stdout.strip'') { should eq '''' }'
    - end
    domain: Accounts
    evidence_type: inventory-state
    impact: 0.7
    levels:
      cis: '1'
    norms:
      cis:
      - 5.4.2.2
      - 8.2.1
      pci-dss: Req-8.1.1
    reboot_survivable: 'yes'
    remediation:
      command: 'id -g root

        usermod -g 0 root   # set root''s primary GID to 0 (only if the audit flagged
        it)

        '
      reason: changing root's primary group is sensitive — confirm before applying
      resource: manual
    severity: high
    socle: SOCLE-CLD-IAM-003
    ssg: accounts_root_gid_zero
    title: Verify Root Has A Primary GID 0
  account-disable-inactive-pw:
    check:
    - describe command('awk -F= \'/^INACTIVE=/{v=$2} END{print (v ~ /^[0-9]+$/ &&
      v>=0 && v<=30)?"ok":"ko"}\' /etc/default/useradd') do
    - '  its(''stdout.strip'') { should eq ''ok'' }'
    - end
    domain: Accounts (login.defs)
    evidence_type: persistent-config
    impact: 0.5
    levels:
      cis:
      - '1'
      - '2'
    norms:
      cis: 5.4.1.5
      nist:
      - IA-4(e)
      - AC-2(3)
      - CM-6(a)
      pci-dss: 8.2.6
    reboot_survivable: 'yes'
    remediation:
      command: useradd -D -f 30
      name: set-default-inactive
      not_if: awk -F= '/^INACTIVE=/{v=$2} END{exit !(v ~ /^[0-9]+$/ && v>=0 && v<=30)}'
        /etc/default/useradd
      resource: exec
    severity: medium
    socle: SOCLE-CLD-IAM-004
    ssg: account_disable_post_pw_expiration
    title: Set Account Expiration Following Inactivity
  account-gid-passwd-group-same:
    check:
    - 'describe command(''awk -F: \''{print $4}\'' /etc/passwd | sort -u | while read
      g; do getent group "$g" >/dev/null || echo "$g"; done'') do'
    - '  its(''stdout.strip'') { should eq '''' }'
    - end
    domain: Accounts
    evidence_type: inventory-state
    impact: 0.3
    levels:
      cis: '1'
    norms:
      cis:
      - 7.2.3
      - 8.2.2
      nist:
      - CM-6(a)
      - IA-2
      pci-dss: 8.2.2
    reboot_survivable: 'yes'
    remediation:
      command: 'awk -F: ''{print $4}'' /etc/passwd | sort -u | while read g; do getent
        group "$g" >/dev/null || echo "missing group gid=$g"; done

        # groupadd -g <gid> <name> for each, or reassign the user''s primary group

        '
      reason: a user's primary GID must exist in /etc/group — create the missing group
        deliberately
      resource: manual
    severity: low
    socle: SOCLE-CLD-IAM-005
    ssg: gid_passwd_group_same
    title: All GIDs referenced in /etc/passwd must be defined in /etc/group
  account-no-empty-passwords:
    check:
    - 'describe command(''awk -F: \''($2==""){print $1}\'' /etc/shadow'') do'
    - '  its(''stdout.strip'') { should eq '''' }'
    - end
    domain: Accounts
    evidence_type: inventory-state
    impact: 1.0
    levels:
      cis: '1'
    norms:
      cis: 8.3.1
      nist:
      - 3.1.1
      - CM-6(a)
      - IA-5(1)(a)
      - IA-5(c)
      pci-dss: Req-8.2.3
    reboot_survivable: 'yes'
    remediation:
      command: 'awk -F: ''($2==""){print $1}'' /etc/shadow   # accounts with NO password

        # passwd -l <user>   (lock) for each, after confirming it should not log in

        '
      reason: locking an account is disruptive — confirm each empty-password account
        before locking
      resource: manual
    severity: critical
    socle: SOCLE-CLD-IAM-006
    ssg: no_empty_passwords
    title: Prevent Login to Accounts With Empty Password
  account-no-future-pw-change:
    check:
    - describe command('d=$(( $(date +%s) / 86400 )); awk -v d="$d" \'BEGIN{FS=":"}($3
      ~ /^[0-9]+$/ && $3+0>d){c++} END{print c?"ko":"ok"}\' /etc/shadow') do
    - '  its(''stdout.strip'') { should eq ''ok'' }'
    - end
    domain: Accounts
    evidence_type: inventory-state
    impact: 0.5
    levels:
      cis:
      - '1'
      - '2'
    norms:
      cis: 5.4.1.6
      pci-dss: 8.3.5
    reboot_survivable: 'yes'
    remediation:
      command: 'd=$(( $(date +%s) / 86400 )); awk -F: -v d="$d" ''($3 ~ /^[0-9]+$/
        && $3+0>d){print $1}'' /etc/shadow

        # for each listed user: chage -d $(date +%F) <user>   (set last change to
        today)

        '
      reason: a future last-change date is per-user — fix each with chage after review
      resource: manual
    severity: medium
    socle: SOCLE-CLD-IAM-007
    ssg: accounts_password_last_change_is_in_past
    title: Ensure all users last password change date is in the past
