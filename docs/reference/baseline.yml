# The pavois hardening baseline — its IDENTITY and VERSION. This is what turns Pavois from a
# scanner config into a CITABLE, versioned standard. `pavois oscal` stamps the OSCAL catalog from
# here (single source of the version/name/date); the site publishes it; the CHANGELOG tracks it.
#
# Bump `version` + add a CHANGELOG entry whenever the published baseline changes (controls added,
# mappings corrected, levels revised). Semantic: MAJOR = controls removed / IDs renamed (breaking
# for consumers), MINOR = controls or mappings added, PATCH = fixes that don't change coverage.
name: Pavois Effective-Configuration Hardening Baseline
id: pavois-baseline
version: 0.2.0
released: "2026-06-26"
authority: Pavois
license: Apache-2.0
url: https://pavois.dev/baseline

# The doctrine that distinguishes this baseline from every file-based one (OVAL/SCAP/Lynis):
doctrine: effective-config
description: >
  A Linux hardening baseline expressed as assertions on the EFFECTIVE running configuration —
  sshd -T, sysctl, auditctl -l, systemctl show — not on configuration files. It therefore audits
  what is actually applied (Includes, drop-ins, kernel defaults resolved), exactly where file-based
  scanners are blind. Each control has a stable OS-neutral id and maps to CIS, ANSSI-BP-028,
  NIST SP 800-53 / 800-171, PCI-DSS and DISA STIG — the standard is a VIEW, never a duplicated rule.

covers: [debian12, debian13, ubuntu2204, ubuntu2404, rhel8, rhel9, fedora]
maps_to: [cis, anssi-bp028, nist-800-53, nist-800-171, pci-dss, stig]
