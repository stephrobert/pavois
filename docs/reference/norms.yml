# Norm catalogue — the standards pavois maps to, with the exact version each set of mappings
# targets, its authority and source. This is the public, self-describing face of the rule base:
# an auditor (or the `pavois norms` API) sees which standard versions are covered and traced.
#
# Versions are SOURCED, never invented:
#   - CIS per-OS: the benchmark version the ansible-lockdown <OS>-CIS repo implements (its README),
#     cross-checked against the SSG datastream profile title.
#   - ANSSI / NIST / PCI: the currently published revision of the spec itself.
#
# This file is also the BASELINE the norm-watcher MCP diffs live sources against: when CIS bumps a
# benchmark (e.g. debian12 1.1.0 -> 1.2.0) or ANSSI revises BP-028, the watcher flags the drift here.
standards:
  cis:
    name: CIS Benchmarks
    authority: Center for Internet Security
    url: https://www.cisecurity.org/cis-benchmarks
    monitor:                       # how the watcher MCP detects a new version
      ansible_lockdown: "<OS>-CIS README declares the implemented benchmark version"
      ssg_release: ComplianceAsCode/content (datastream)
    benchmark_version:             # version pavois's cis mappings target, per OS (sourced)
      debian12:   {version: "1.1.0", source: ansible-lockdown/DEBIAN12-CIS}
      debian13:   {version: "1.0.0", source: ansible-lockdown/DEBIAN13-CIS}
      ubuntu2204: {version: "3.0.0", source: ansible-lockdown/UBUNTU22-CIS}
      ubuntu2404: {version: "1.0.0", source: ansible-lockdown/UBUNTU24-CIS}
      rhel8:      {version: "4.0.0", source: ansible-lockdown/RHEL8-CIS}
      rhel9:      {version: "2.0.0", source: ansible-lockdown/RHEL9-CIS}
      fedora:     {version: null,    source: "no CIS benchmark exists for Fedora"}

  bp28:
    name: ANSSI-BP-028 — Recommandations de configuration d'un système GNU/Linux
    authority: ANSSI (Agence nationale de la sécurité des systèmes d'information)
    version: "2.0"
    date: "2022-09"
    url: https://cyber.gouv.fr/publications/recommandations-de-securite-relatives-un-systeme-gnulinux
    monitor: {source: cyber.gouv.fr, method: published revision string}

  nist-800-53:
    name: NIST SP 800-53 — Security and Privacy Controls for Information Systems and Organizations
    authority: NIST
    version: "Rev 5"
    url: https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final
    note: pavois `nist` tags in control-family form (e.g. AC-3, AU-9) map here
    monitor: {source: usnistgov/oscal-content, method: OSCAL catalog version}

  nist-800-171:
    name: NIST SP 800-171 — Protecting Controlled Unclassified Information
    authority: NIST
    version: "Rev 2"
    url: https://csrc.nist.gov/pubs/sp/800/171/r2/final
    note: pavois `nist` tags in dotted form (e.g. 3.1.7) map here

  pci-dss:
    name: PCI DSS — Payment Card Industry Data Security Standard
    authority: PCI Security Standards Council
    version: "4.0.1"
    url: https://www.pcisecuritystandards.org/document_library/

  stig:
    name: DISA STIG — Security Technical Implementation Guides
    authority: DISA (Defense Information Systems Agency)
    url: https://public.cyber.mil/stigs/
    status: not yet mapped in pavois (0 controls) — expansion candidate via SSG/ansible-lockdown STIG

# How pavois earns the "reference" claim: every norm/OS is validated against >=2 independent
# machine-readable authorities, or it is explicitly flagged single-source.
provenance:
  validation_sources:
    - ComplianceAsCode/content (SSG) v0.1.81 — datastream oracle
    - ansible-lockdown <OS>-CIS — fetched live via gh (consensus oracle)
    - Wazuh SCA — nist/pci/iso/hipaa/gdpr multi-framework (control-bridge pending)
    - NIST OSCAL (usnistgov/oscal-content) — 800-53 catalog oracle
  rule: ">=2 independent sources per norm/OS, else flagged single-source"
  dashboard: reports/validation-dashboard.json (tools/validate_all.py)
