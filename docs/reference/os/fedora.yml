# OS primitives: the distro facts a control refers to as @{pkg.httpd}.
# One cell = one fact, provable with one command (apt-cache policy).
# A wrong cell breaks one control and is fixed HERE, not in 100 @os blocks.
pkg:
  aide: aide
  audit: audit
  audit_libs: audit-libs
  bind: bind
  cron: cronie
  dhcp: dhcp-server
  dovecot: dovecot
  gdm: gdm
  httpd: httpd
  net_snmp: net-snmp
  openldap_clients: openldap-clients
  pam_pwquality: libpwquality
  rsync: rsync
  telnet_server: telnet-server
  tftp_server: tftp-server
  avahi_daemon: avahi
  opensc: opensc
  rsh_client: rsh
  slapd: openldap-servers
  talkd: talk-server
  xorg_x11_server_common: xorg-x11-server-common
  xserver_xorg_core: xorg-x11-server-Xorg
  dnf_automatic: dnf5-plugin-automatic
  sssd: sssd
  tftp: tftp
svc:
  nfs: nfs-server.service
  auditd: auditd.service
  crond: crond.service
  rngd: rngd.service
  systemd_journal_upload: systemd-journal-upload.service
  systemd_journald: systemd-journald.service
  sshd: sshd.service
  chrony: chronyd.service
  pkg_timer: dnf-makecache dnf-automatic
  httpd: httpd.service
  kdump: kdump.service
  rsyncd: rsyncd.service
  smb: smb.service
  tftp: tftp.socket
  usbguard: usbguard.service
usr:
  varlog: root
path:
  sysstat: /etc/sysconfig/sysstat
grp:
  cron: root
  at: root
