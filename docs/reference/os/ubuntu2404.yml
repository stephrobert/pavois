# OS primitives: the distro facts a control refers to as @{pkg.httpd}.
# One cell = one fact, provable with one command (apt-cache policy).
# A wrong cell breaks one control and is fixed HERE, not in 100 @os blocks.
pkg:
  aide: aide-common
  audit: auditd
  audit_libs: libaudit1
  avahi_daemon: avahi-daemon
  bind: bind9
  cron: cron
  dhcp: isc-dhcp-server
  dovecot: dovecot-core
  gdm: gdm3
  httpd: apache2
  net_snmp: snmpd
  openldap_clients: ldap-utils
  opensc: opensc
  pam_pwquality: libpam-pwquality
  rsh_client: rsh-client
  rsync: rsync
  slapd: slapd
  snmpd: snmpd
  talkd: talkd
  telnet_server: telnetd
  tftp_server: tftpd-hpa
  xorg_x11_server_common: xserver-xorg-core
  xserver_xorg_core: xserver-common
svc:
  dhcpd: isc-dhcp-server.service
  dhcpd6: isc-dhcp-server6.service
  httpd: apache2.service
  kdump: kdump-tools.service
  nfs: nfs-server.service
  rsyncd: rsync.service
  smb: smbd.service
  tftp: tftpd-hpa.service
  auditd: auditd.service
  cron: cron.service
  sshd: ssh.service
  sssd: sssd.service
  systemd_journal_upload: systemd-journal-upload.service
  systemd_journald: systemd-journald.service
  chrony: chrony.service
  pkg_timer: apt-daily apt-daily-upgrade unattended-upgrades
usr:
  varlog: syslog
path:
  sysstat: /etc/sysstat/sysstat
