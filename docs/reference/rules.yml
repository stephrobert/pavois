  danger: 'fapolicyd is aggressive application whitelisting: it denies execution of any binary not in its trust database. If the trust DB is incomplete (e.g. fapolicyd-cli --update did not populate the rpmdb backend, or a daemon ships an interpreter/plugin outside the RPM set), fapolicyd BLOCKS those executions and the affected service fails to start; the denial appears in /var/log/fapolicyd-access.log (dec=deny), not in the service''s own logs. Enable only after rebuilding the trust DB (rm /var/lib/fapolicyd/*.mdb; fapolicyd-cli --update) and validating in permissive mode first.'
