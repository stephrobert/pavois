  applicable_os:
  - almalinux9
  - debian12
  - debian13
  - rhel8
  - rhel9
  - ubuntu2204
  - ubuntu2404
  danger: noexec on /var breaks apt/dpkg (maintainer scripts execute under /var) and can leave the package manager unusable. CIS recommends only nodev,nosuid for /var; this control is delivered as a manual fix, never auto-applied.
  domain: Mounts
  evidence_type: effective-runtime
  impact: 0.5
  levels:
    bp28: intermediary
  norms:
    bp28: R28
  note:
    '@os':
      debian12: 'pavois does not auto-apply noexec to /var on Debian: dpkg executes maintainer scripts from /var/lib/dpkg/info, so noexec on /var breaks apt/dpkg (postinst Permission denied). CIS deliberately omits /var noexec for this reason (only nodev,nosuid); ANSSI R28 lists it but it is incompatible with Debian package management. Apply manually only if you accept this.'
      debian13: 'pavois does not auto-apply noexec to /var on Debian: dpkg executes maintainer scripts from /var/lib/dpkg/info, so noexec on /var breaks apt/dpkg (postinst Permission denied). CIS deliberately omits /var noexec for this reason (only nodev,nosuid); ANSSI R28 lists it but it is incompatible with Debian package management. Apply manually only if you accept this.'
      ubuntu2204: 'pavois does not auto-apply noexec to /var on Debian: dpkg executes maintainer scripts from /var/lib/dpkg/info, so noexec on /var breaks apt/dpkg (postinst Permission denied). CIS deliberately omits /var noexec for this reason (only nodev,nosuid); ANSSI R28 lists it but it is incompatible with Debian package management. Apply manually only if you accept this.'
      ubuntu2404: 'pavois does not auto-apply noexec to /var on Debian: dpkg executes maintainer scripts from /var/lib/dpkg/info, so noexec on /var breaks apt/dpkg (postinst Permission denied). CIS deliberately omits /var noexec for this reason (only nodev,nosuid); ANSSI R28 lists it but it is incompatible with Debian package management. Apply manually only if you accept this.'
  reboot_survivable: 'yes'
  remediation:
    '@os':
      debian12:
        command: '# Add noexec to /var ONLY after confirming /var is a separate fs with nothing executing from it

          # (apt/dpkg run maintainer scripts under /var). Edit the /var line in /etc/fstab to add ,noexec

          # then:  mount -o remount /var

          '
        reason: noexec on /var commonly breaks apt/dpkg maintainer scripts, verify /var layout first
        resource: manual
  severity: medium
  socle: SOCLE-CLD-MNT-023
  ssg: mount_option_var_noexec
  template:
    mount_point: /var
