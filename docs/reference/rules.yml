account-accounts-no-uid-except-zero:
  applicable_os:
  - almalinux9
  - debian12
  - debian13
  - fedora
  - rhel8
  - rhel9
  - ubuntu2204
  - ubuntu2404
  check:
  - 'describe command(''awk -F: \''($3==0 && $1!="root"){print $1}\'' /etc/passwd'') do'
  - '  its(''stdout.strip'') { should eq '''' }'
  - end
  domain: Accounts
  evidence_type: inventory-state
  impact: 1.0
  levels:
    cis: '1'
  norms:
    cis:
      '@os':
        almalinux9: 5.4.2.1
        debian12:
        - 5.4.2.1
        - 8.2.1
        debian13: 5.4.2.1
        fedora: 5.4.2.1
        rhel8: 5.4.2.1
        rhel9: 5.4.2.1
        ubuntu2204: 5.4.2.1
        ubuntu2404:
        - 5.4.2.1
        - 8.2.1
    nist:
    - 3.1.1
    - AC-6(5)
    - IA-2
    - IA-4(b)
    pci-dss:
      '@os':
        almalinux9: 8.2.1
        debian12: Req-8.5
        debian13: 8.2.1
        fedora: 8.2.1
        rhel8: 8.2.1
        rhel9: 8.2.1
        ubuntu2204: 8.2.1
        ubuntu2404: Req-8.5
  reboot_survivable: 'yes'
  remediation:
    '@os':
      debian12:
        command: '# List accounts with uid 0 other than root; remove/fix each ONLY after confirming it is rogue.

          awk -F: ''($3==0 && $1!="root"){print $1}'' /etc/passwd

          # for a confirmed rogue account: userdel <name>   (irreversible, verify it is not legitimate)

          '
        reason: deleting an account is irreversible, a human must confirm it is rogue
        resource: manual
  severity: critical
  socle: SOCLE-CLD-IAM-001
  ssg: accounts_no_uid_except_zero
  title: Verify Only Root Has UID 0
account-accounts-password-all-shadowed:
  applicable_os:
  - almalinux9
  - debian12
  - debian13
  - fedora
  - rhel8
  - rhel9
  - ubuntu2204
  - ubuntu2404
  check:
  - 'describe command(''awk -F: \''($2!="x" && $2!="*" && $2!="!"){print $1}\'' /etc/passwd'') do'
  - '  its(''stdout.strip'') { should eq '''' }'
  - end
  domain: Accounts
  evidence_type: inventory-state
  impact: 1.0
  levels:
    cis: '1'
  norms:
    cis:
      '@os':
        almalinux9: 7.2.1
        debian12:
        - 7.2.1
        - 8.3.2
        debian13: 7.2.1
        fedora: 7.2.1
        rhel8: 7.2.1
        rhel9: 7.2.1
        ubuntu2204: 7.2.1
        ubuntu2404:
        - 7.2.1
        - 8.3.2
    nist:
    - 3.5.10
    - CM-6(a)
    - IA-5(h)
    pci-dss:
      '@os':
        almalinux9: 8.3.2
        debian12: Req-8.2.1
        debian13: 8.3.2
        fedora: 8.3.2
        rhel8: 8.3.2
        rhel9: 8.3.2
        ubuntu2204: 8.3.2
        ubuntu2404: Req-8.2.1
  reboot_survivable: 'yes'
  remediation:
    '@os':
      debian12:
        command: 'grep -E ''^[^:]+:[^:!*x]'' /etc/passwd   # accounts with a hash still in /etc/passwd

          pwconv   # migrate them to /etc/shadow

          '
        reason: moving passwords to /etc/shadow with pwconv is safe but verify no app reads /etc/passwd hashes
        resource: manual
  severity: critical
  socle: SOCLE-CLD-IAM-002
  ssg: accounts_password_all_shadowed
  title: Verify All Account Password Hashes are Shadowed
