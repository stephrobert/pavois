account-no-future-pw-change:
  applicable_os:
  - debian12
  - debian13
  check:
  - describe command('d=$(( $(date +%s) / 86400 )); awk -v d="$d" \'BEGIN{FS=":"}($3 ~ /^[0-9]+$/ && $3+0>d){c++} END{print c?"ko":"ok"}\' /etc/shadow') do
  - '  its(''stdout.strip'') { should eq ''ok'' }'
  - end
  domain: Accounts
  evidence_type: inventory-state
  impact: 0.5
  levels:
    cis:
    - '1'
    - '2'
  norms:
    cis: 5.4.1.6
    pci-dss: 8.3.5
  reboot_survivable: 'yes'
  remediation:
    command: 'd=$(( $(date +%s) / 86400 )); awk -F: -v d="$d" ''($3 ~ /^[0-9]+$/ && $3+0>d){print $1}'' /etc/shadow

      # for each listed user: chage -d $(date +%F) <user>   (set last change to today)

      '
    reason: a future last-change date is per-user, fix each with chage after review
    resource: manual
  severity: medium
  socle: SOCLE-CLD-IAM-007
  ssg: accounts_password_last_change_is_in_past
  title: Ensure all users last password change date is in the past
