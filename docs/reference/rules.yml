    cis: '1'
  norms:
    cis:
      '@os':
        almalinux9: 5.4.2.2
        debian12:
        - 5.4.2.2
        - 8.2.1
        debian13: 5.4.2.2
        fedora: 5.4.2.2
        rhel8: 5.4.2.2
        rhel9: 5.4.2.2
        ubuntu2204: 5.4.2.2
        ubuntu2404:
        - 5.4.2.2
        - 8.2.1
    pci-dss:
      '@os':
