  - rhel9
  - ubuntu2204
  - ubuntu2404
  check:
  - 'describe command(''awk -F: \''($1=="root" && $4!=0){print}\'' /etc/passwd'') do'
  - '  its(''stdout.strip'') { should eq '''' }'
  - end
