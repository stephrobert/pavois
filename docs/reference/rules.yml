account-disable-inactive-pw:
  applicable_os:
  - debian12
  - debian13
  check:
  - describe command('awk -F= \'/^INACTIVE=/{v=$2} END{print (v ~ /^[0-9]+$/ && v>=0 && v<=30)?"ok":"ko"}\' /etc/default/useradd') do
  - '  its(''stdout.strip'') { should eq ''ok'' }'
  - end
  domain: Accounts (login.defs)
  evidence_type: persistent-config
  impact: 0.5
  levels:
    cis:
    - '1'
    - '2'
  norms:
    cis: 5.4.1.5
    nist:
    - IA-4(e)
    - AC-2(3)
    - CM-6(a)
    pci-dss: 8.2.6
  reboot_survivable: 'yes'
  remediation:
    command: useradd -D -f 30
    name: set-default-inactive
    not_if: awk -F= '/^INACTIVE=/{v=$2} END{exit !(v ~ /^[0-9]+$/ && v>=0 && v<=30)}' /etc/default/useradd
    resource: exec
  severity: medium
  socle: SOCLE-CLD-IAM-004
  ssg: account_disable_post_pw_expiration
  title: Set Account Expiration Following Inactivity
account-gid-passwd-group-same:
  applicable_os:
  - almalinux9
  - debian12
  - debian13
  - fedora
  - rhel8
  - rhel9
  - ubuntu2204
  - ubuntu2404
  check:
  - 'describe command(''awk -F: \''{print $4}\'' /etc/passwd | sort -u | while read g; do getent group "$g" >/dev/null || echo "$g"; done'') do'
  - '  its(''stdout.strip'') { should eq '''' }'
  - end
  domain: Accounts
  evidence_type: inventory-state
  impact: 0.3
  levels:
    cis: '1'
  norms:
    cis:
      '@os':
        almalinux9: 7.2.3
        debian12:
        - 7.2.3
        - 8.2.2
        debian13: 7.2.3
        fedora: 7.2.3
        rhel8: 7.2.3
        rhel9: 7.2.3
        ubuntu2204: 7.2.3
        ubuntu2404:
        - 7.2.3
        - 8.2.2
    nist:
    - CM-6(a)
    - IA-2
    pci-dss: 8.2.2
  reboot_survivable: 'yes'
  remediation:
    '@os':
      debian12:
        command: 'awk -F: ''{print $4}'' /etc/passwd | sort -u | while read g; do getent group "$g" >/dev/null || echo "missing group gid=$g"; done

          # groupadd -g <gid> <name> for each, or reassign the user''s primary group

          '
        reason: a user's primary GID must exist in /etc/group, create the missing group deliberately
        resource: manual
  severity: low
  socle: SOCLE-CLD-IAM-005
  ssg: gid_passwd_group_same
  title: All GIDs referenced in /etc/passwd must be defined in /etc/group
