# Pre-commit hooks for pavois. Install: `pre-commit install` (the `pre-commit` tool
# ships via mise). Go hooks run against the ./go module and use the toolchain on PATH
# (provided by `mise install`). Run on all files: `pre-commit run --all-files`.
#
# `pre-commit install` wires the pre-commit hook and nothing else unless it is told which hook
# types to install. The pre-push hook declared at the end of this file would then sit here doing
# nothing on every machine — a control that reads as one. Declaring the types makes the single
# documented install command sufficient.
default_install_hook_types: [pre-commit, pre-push]

repos:
  # General hygiene + a hard stop on accidentally committing secrets/keys (this repo
  # ships public — see the publish-hygiene rules).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Python tooling: ruff (lint + format) and bandit (security), config in pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/PyCQA/bandit
    rev: '1.9.2'
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml']
        additional_dependencies: ['bandit[toml]']

  # Go quality gate — mirrors the CI workflow and the go-production-engineer standard.
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        language: system
        entry: bash -c 'cd go && test -z "$(gofmt -l .)" || { echo "gofmt needed:"; gofmt -l .; exit 1; }'
        pass_filenames: false
        files: ^go/.*\.go$
      - id: go-vet
        name: go vet
        language: system
        entry: bash -c 'cd go && go vet ./...'
        pass_filenames: false
        files: ^go/.*\.go$
      - id: golangci-lint
        name: golangci-lint
        language: system
        entry: bash -c 'cd go && golangci-lint run ./...'
        pass_filenames: false
        files: ^go/.*\.go$
      - id: go-mod-tidy
        name: go mod tidy
        language: system
        entry: bash -c 'cd go && go mod tidy && git diff --exit-code go.mod go.sum'
        pass_filenames: false
        files: ^go/go\.(mod|sum)$
      - id: trufflehog
        name: TruffleHog (secret scan)
        # --no-update: never auto-fetch a new binary at hook time (LOTP supply-chain hardening).
        entry: trufflehog git file://. --since-commit HEAD --results=verified --fail --no-update
        language: system
        pass_filenames: false
      - id: trufflehog-lab
        name: TruffleHog (lab-topology leak scan)
        # The scan above only reports VERIFIED credentials (a live API confirms them), so it is blind
        # to the leak that actually reached a tracked file: a private lab IP, an internal hostname, a
        # plaintext lab password. These are custom regex detectors (.trufflehog-lab.yaml) run in
        # isolation (--include-detectors=CustomRegex) so built-in unverified hits add no noise, and
        # surfaced as unverified (--results includes unverified) since a regex match is never "verified".
        # RFC 5737 example IPs and $VAR-parameterised passwords do not match, by construction.
        # The detector config is self-clean by construction (its patterns never match their own text),
        # so it needs no path exclusion, which pre-commit's hook context would ignore anyway.
        entry: trufflehog git file://. --since-commit HEAD --config=.trufflehog-lab.yaml --include-detectors=CustomRegex --results=verified,unverified,unknown --no-verification --fail --no-update
        language: system
        pass_filenames: false

      # On pre-push, and only this one. The per-file hooks above judge what a commit touched;
      # this runs the whole offline gate set on what is about to leave the machine, which is a
      # different question — a branch can be green commit by commit and red as a whole.
      #
      # Why `prepush` and not, say, `site:verify` or a scan: the gate set is deterministic,
      # offline and takes ~30s. site:verify regenerates content (a hook must not rewrite the tree
      # it checks) and a real scan needs a live VM, so as hooks they would fail on the environment
      # rather than on the code — and the reflex that teaches is `--no-verify`, which disables
      # every hook in this file at once. `mise run testplan` is what names those heavier runs
      # instead, and prepush prints it on every push.
      - id: prepush
        name: the gates a pull request will fail on
        language: system
        entry: mise run prepush
        pass_filenames: false
        always_run: true
        stages: [pre-push]
