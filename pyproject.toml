# Offline Python tooling for pavois (reference render, validation, norm-studio MCP).
# Not the shipped product: the binary is 100% Go. This file pins the toolchain config
# (ruff lint+format, bandit security) and declares deps so `uv sync` works as an
# alternative to the inline `uv run --with ...` invocations in mise.toml.
[project]
name = "pavois-tools"
version = "0"
description = "Offline tooling for pavois: reference render, cross-validation, norm-studio MCP."
requires-python = ">=3.12"
dependencies = ["pyyaml"]

[project.optional-dependencies]
studio = ["fastmcp"]
dev = ["ruff", "bandit[toml]"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["tools", "test-vms"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, C4 comprehensions, SIM simplify.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# These scripts bootstrap sys.path to import sibling tool modules before the import block.
"tools/validate_reference.py" = ["E402"]
"tools/build_reference.py" = ["E402"]

[tool.bandit]
# Skip the three universally-noisy subprocess advisories: this tooling deliberately shells out
# to git/incus/oscap/cinc with CONTROLLED list-args and shell=False (no injection surface).
# B404 (import advisory), B603 (subprocess shell=False: the safe pattern), B607 (PATH lookup).
# Everything else (hardcoded /tmp, try/except/pass, etc.) is fixed in the code, not skipped.
skips = ["B404", "B603", "B607"]
