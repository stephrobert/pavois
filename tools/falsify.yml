# Declared falsifications: for each guard that matters, the mutation that MUST make its test go red.
#
# A green test proves nothing on its own. It proves something the day you can show it failing when
# the thing it guards is removed — and that day has to be re-run, because a test can stop biting
# without anybody touching it (a refactor moves the assertion, a helper starts returning early, a
# fixture drifts until the case is unreachable).
#
# Each entry replaces `find` with `replace` in `file`, exactly `occurrences` time(s), then:
#   1. the mutant MUST still compile — a mutation that breaks the build makes every test fail,
#      which looks exactly like the guard being proven and is worth nothing. Prefer a mutation that
#      neuters the logic while keeping every symbol used (`ContainsAny(p, "")`, `if false && …`);
#   2. `test` MUST then fail. If it still passes, the guard is not tested, and the claim that it is
#      protected is a claim about the past.
#
# Add one whenever you add a guard whose failure would be silent, expensive, or destructive.

falsifications:
  - name: rollback-never-restores-a-glob
    why: >-
      plannedTargets decides what `harden rollback` restores and deletes on someone's host. A glob
      reaching that list does not produce a wrong report, it touches the wrong files. Neutering the
      glob filter (ContainsAny against an empty set is always false) must be caught.
    file: go/cmd/rollback.go
    find: 'strings.ContainsAny(path, "*?")'
    replace: 'strings.ContainsAny(path, "")'
    occurrences: 1
    package: ./cmd
    test: TestPlannedTargetsFromRecipe

  - name: aggregated-dropin-keeps-compliant-siblings
    why: >-
      The sshd/sysctl/cmdline/keyval drop-ins are rewritten WHOLESALE, so a run must re-emit the
      compliant siblings too. Emitting only what the operator enabled silently regresses the rest —
      re-enabling root SSH is the textbook case, and this project has already shipped that class of
      bug once (a shared drop-in that switched off syslog forwarding while every control stayed green).
    file: go/cmd/harden.go
    find: 'keepCompliant := aggregated && !enabled && r.Status == "compliant"'
    replace: 'keepCompliant := aggregated && !enabled && r.Status == "never-matches"'
    occurrences: 1
    package: ./cmd
    test: TestCompileRecipeKeepsCompliantAggregated

  - name: one-critical-caps-the-grade-in-band-E
    why: >-
      The grade is what `--fail-under` compares against in somebody's CI. Losing the critical-finding
      penalty does not look wrong on a report: it turns a host with a critical failure from E/30 into
      B/75, and the gate people trust keeps saying yes.
    file: go/internal/audit/audit.go
    find: 'if sum.Counts["critical"] > 0 && pts > 30 {'
    replace: 'if false && sum.Counts["critical"] > 0 && pts > 30 {'
    occurrences: 1
    package: ./internal/audit
    test: TestGrade
