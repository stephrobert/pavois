name: 'download-artifact (act stub)'
description: >
  The other half of the act artifact stub: reads back what the upload stub stored. See
  tools/release/act-stubs/upload-artifact/action.yml for why the transport is replaced.

inputs:
  name:
    description: 'Artifact name'
    required: false
    default: ''
  path:
    description: 'Where to restore it'
    required: false
    default: '.'
  pattern:
    description: 'Accepted and ignored (release.yml downloads by name)'
    required: false
    default: ''
  merge-multiple:
    description: 'Accepted and ignored'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        ART_NAME: ${{ inputs.name }}
        ART_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        src="/tmp/act-artifacts/$ART_NAME"
        [ -d "$src" ] || { echo "::error::no artifact named $ART_NAME was uploaded"; exit 1; }
        mkdir -p "$ART_PATH"
        cp -r "$src/." "$ART_PATH/"
        echo "act stub: restored artifact $ART_NAME ($(find "$ART_PATH" -type f | wc -l) file(s)) -> $ART_PATH"
