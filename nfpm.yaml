# nfpm config: builds pavois .deb/.rpm from the release binaries (https://nfpm.goreleaser.com).
# ARCH (amd64|arm64) and VERSION are injected per invocation by the release workflow:
#   ARCH=amd64 VERSION=0.1.0 nfpm pkg --config nfpm.yaml --packager deb --target dist/pavois_0.1.0_amd64.deb
name: pavois
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: Stéphane Robert <robert.stephane.28@gmail.com>
description: |
  Effective Linux compliance scanner over CINC Auditor.
  Audits the resolved runtime configuration (sshd -T, sysctl, systemctl, auditctl)
  and reports by standard (CIS, ANSSI BP-028, NIST, PCI-DSS, STIG) with an A-E grade.
vendor: Pavois
homepage: https://pavois.dev
license: Apache-2.0
contents:
  - src: ./dist/pavois-linux-${ARCH}
    dst: /usr/bin/pavois
    file_info:
      mode: 0755
# No `depends:`, and that is deliberate: the binary is static (release.yml builds with
# CGO_ENABLED=0), so there is no library for the package to ask for. What pavois does need is a scan
# engine, and CINC Auditor is in no distribution repository: it installs from omnitruck, so no
# package manager can be told to fetch it. A field report read that runtime refusal as "missing
# dependencies" on AlmaLinux, which is why the package now says it at install time instead of
# letting the first scan be the messenger.
scripts:
  postinstall: ./packaging/postinstall.sh
