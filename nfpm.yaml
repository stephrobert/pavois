# nfpm config: builds pavois .deb/.rpm from the release binaries (https://nfpm.goreleaser.com).
# ARCH (amd64|arm64) and VERSION are injected per invocation by the release workflow:
#   ARCH=amd64 VERSION=0.1.0 nfpm pkg --config nfpm.yaml --packager deb --target dist/pavois_0.1.0_amd64.deb
name: pavois
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: Stéphane Robert <robert.stephane.28@gmail.com>
description: |
  Effective Linux compliance scanner over CINC Auditor.
  Audits the resolved runtime configuration (sshd -T, sysctl, systemctl, auditctl)
  and reports by standard (CIS, ANSSI BP-028, NIST, PCI-DSS, STIG) with an A-E grade.
vendor: Pavois
homepage: https://pavois.dev
license: Apache-2.0
contents:
  - src: ./dist/pavois-linux-${ARCH}
    dst: /usr/bin/pavois
    file_info:
      mode: 0755
