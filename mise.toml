# mise: unified toolchain + task runner for pavois (versions pinned, reproducible across
# machines and CI). Activate: `mise install` then `mise trust`. Run a task: `mise run <task>`
# (alias `mise r <task>`). List: `mise tasks`. This replaces the ad-hoc bin/pavois + scripts.
[tools]
go = "1.26.6"        # the pavois binary (go/)
node = "22.22.0"     # the bilingual Astro hardening site (site/)
python = "3.12.11"   # offline tooling: validation, reference render, norm-studio
uv = "0.12.10"       # 21 tasks shell out to `uv run --with pyyaml python3 ...`; without
                     # it declared here they only work on a machine that happens to have
                     # uv from somewhere else, which is how site-deploy failed on a clean
                     # runner with "uv: not found" while every developer machine was fine
gh = "2.92.0"        # benchmark sources (ansible-lockdown, SSG releases)
# Quality + supply-chain tooling (mirrors the CI workflows + pre-commit hooks; pinned).
golangci-lint = "2.12.2"  # Go linters (errcheck, gosec, staticcheck, errorlint, …)
ruff = "0.14.9"           # Python lint + format
trufflehog = "3.95.6"     # secret scanning (pre-commit + CI)
actionlint = "1.7.12"
zizmor = "1.30.0"
"ubi:boostsecurityio/poutine" = "1.1.6"
# Runs release.yml itself, locally, so what is checked is what the release build produces rather
# than a local build with the embed directories already filled (see tools/release/ci_release_build.sh).
# 0.2.89 or newer: act's artifact server rejected actions/upload-artifact@v7 before that, with
# `unknown field "mime_type"`, which fails the corpus job and never reaches the build.
act = "0.2.89"

[env]
CHEF_LICENSE = "accept-silent"   # CINC/InSpec runs non-interactively

# ---- Go binary -------------------------------------------------------------------------------
[tasks.build]
description = "Build the pavois Go binary"
dir = "{{config_root}}/go"
run = "go build -o pavois ."

[tasks.fuzz]
description = "Fuzz the parsers fed by input pavois does not control (InSpec JSON, the rollback's recipe). Longer run: FUZZTIME=5m mise run fuzz"
dir = "{{config_root}}/go"
run = """
t="${FUZZTIME:-30s}"
echo "fuzzing for $t per target (set FUZZTIME to change)"
go test ./internal/audit/ -run '^$' -fuzz 'FuzzProves' -fuzztime="$t"
go test ./internal/audit/ -run '^$' -fuzz 'FuzzEvaluate' -fuzztime="$t"
go test ./cmd/ -run '^$' -fuzz 'FuzzPlannedTargets' -fuzztime="$t"
"""

[tasks.scan]
description = "Scan a target, e.g. `mise run scan -- local --profile effective-config`"
depends = ["build"]
run = "{{config_root}}/go/pavois scan"

[tasks.serve]
description = "Serve the reports UI on http://localhost:8098"
depends = ["build"]
run = "{{config_root}}/go/pavois serve"

[tasks.norms]
description = "Emit the norm catalogue API (standards, versions, live coverage)"
depends = ["build"]
run = "{{config_root}}/go/pavois norms"

[tasks.rules]
description = "Emit the rule base as JSON, e.g. `mise run rules -- --os debian12`"
depends = ["build"]
run = "{{config_root}}/go/pavois rules"

# ---- Validation / cross-validation ----------------------------------------------------------
[tasks.datastreams]
description = "Fetch the SSG datastreams (2nd validation source), idempotent"
run = "tools/fetch_datastreams.sh"

[tasks.validate]
description = "Cross-validate CIS coverage for all OSes (>=2 sources -> reports/validation-dashboard.json)"
depends = ["datastreams"]
run = "uv run --with pyyaml python3 tools/validate_all.py"

[tasks."validate:bp28"]
description = "Validate ANSSI-BP-028 tags against the OFFICIAL v2.0 PDF (flags stale v1.2 R-numbers)"
run = "uv run --with pyyaml python3 tools/validate_bp28.py"

[tasks."focus"]
description = "Single-OS view scoped to what you work on: focus <os> --failing | --domain X | --diff <os2>"
run = "uv run --with pyyaml python3 tools/focus.py"

[tasks."lint:rules"]
description = "Coherence lint of rules.yml (SSG fossils, impossible checks, dangerous remediations, guard/remediation asymmetry)"
run = "uv run --with pyyaml python3 tools/lint_rules.py"

[tasks."validate:mappings"]
description = "Cross-validate NIST + PCI-DSS tags vs intuitem/ciso-assistant frameworks (flags suspect refs)"
run = "uv run --with pyyaml python3 tools/validate_mappings.py"

[tasks."validate:i18n"]
description = "Check FR/EN structural parity of the handbook (same H2 sections, FAQ pairs, code fences, links)"
run = "python3 tools/validate_i18n_parity.py"

[tasks."gen"]
description = "DRY build: render the 8 per-OS reference files from docs/reference/rules.yml"
run = "uv run --with pyyaml python3 tools/gen.py render"

[tasks."gen:verify"]
description = "CI guard: the 8 OS files match render(rules.yml) (DRY source in sync)"
run = "uv run --with pyyaml python3 tools/gen.py verify"

[tasks."gen:socle"]
description = "Assign SOCLE-<DOM>-<FAM>-<N> refs to controls (pavois = SOCLE Linux profile)"
run = "uv run --with pyyaml python3 tools/gen_socle_refs.py"

[tasks."gen:evidence"]
description = "Classify each control by evidence_type (effective-runtime / persistent-config / inventory-state / filesystem-state / manual / behavioral)"
run = "uv run --with pyyaml python3 tools/gen_evidence_type.py"

[tasks."gen:reboot"]
description = "Classify each control by reboot_survivable (yes/no/unknown): the persistence axis of the qualified verdict; run after gen:evidence"
run = "uv run --with pyyaml python3 tools/gen_reboot_survivable.py"

[tasks."gen:example"]
description = "Regenerate the site's sample scan + campaign reports from the anonymized fixtures (docs/examples/): keeps them current and leak-free by construction"
depends = ["build"]
run = [
  "{{config_root}}/go/pavois render {{config_root}}/docs/examples/after.json --machine 203.0.113.10 --transport ssh --timestamp '2026-07-13 21:07:00 UTC' --out {{config_root}}/site/public/sample-report.html",
  "{{config_root}}/go/pavois diff {{config_root}}/docs/examples/before.json {{config_root}}/docs/examples/after.json --html {{config_root}}/site/public/sample-campaign.html --json {{config_root}}/site/public/sample-campaign.json",
]

[tasks."gen:domain-refs"]
description = "Generate site/src/data/domain-refs.json (handbook + blog guides + man pages per domain)"
run = "uv run --with pyyaml python3 tools/gen_domain_refs.py"

[tasks."render"]
description = "Render the InSpec corpus (profiles/linux/*/controls/*.rb) from the per-OS reference"
depends = ["gen"]
run = "bash {{config_root}}/tools/render.sh"

[tasks."oscal:verify"]
description = "FAIL if `scan --format oscal` stops being valid OSCAL 1.1.2 assessment-results"
# The claim on the site is that the export is conformant, so something has to keep it true.
# check-jsonschema, not plain jsonschema: the NIST schema uses \p character classes that the
# latter crashes on.
run = """
set -e
schema=${OSCAL_SCHEMA:-/tmp/oscal_assessment-results_schema.json}
[ -s "$schema" ] || curl -sSL -o "$schema" \
  https://github.com/usnistgov/OSCAL/releases/download/v1.1.2/oscal_assessment-results_schema.json
out=$(mktemp); tmp=$(mktemp -d); trap 'rm -rf "$out" "$tmp"' EXIT
# The sample is COPIED into a temp dir before being read. `scan --from` writes its HTML companion
# report next to its input, so reading docs/examples/after.json directly drops an untracked
# after.html in the tree on every run, including in CI. --out only moves the JSON.
cp "${OSCAL_SAMPLE:-{{config_root}}/docs/examples/after.json}" "$tmp/sample.json"
{{config_root}}/go/pavois scan local --from "$tmp/sample.json" --out "$tmp" --format oscal > "$out"
uvx check-jsonschema --schemafile "$schema" "$out"
"""

[tasks."oscal"]
description = "Publish the pavois baseline as OSCAL (catalog + per-OS profiles)"
depends = ["build", "gen"]
run = "{{config_root}}/go/pavois oscal --out {{config_root}}/site/public/oscal"

[tasks."regen"]
description = "Regenerate every derived artifact from source (reference -> .rb corpus + OSCAL). Run this on a fresh from-source clone before scanning."
depends = ["render", "oscal"]
run = "echo 'regen complete: corpus + OSCAL rebuilt from docs/reference/'"

# ---- Norm studio (MCP content engine) -------------------------------------------------------
[tasks.studio]
description = "Run the norm-studio MCP server (surfaces official sources, exploits reference docs)"
run = "uv run --with fastmcp --with pyyaml tools/norm_studio/server.py"

[tasks."gen:cli"]
description = "Generate the site's CLI reference from the BINARY itself (pavois clidocs), so it cannot drift"
depends = ["build"]
run = "{{config_root}}/go/pavois clidocs > {{config_root}}/site/src/data/cli.json"

[tasks."gen:benchmarks"]
description = "Generate site/src/data/benchmarks.json (the CIS benchmark version per OS, incl. the 3 inherited OSes) from docs/reference/norms.yml, so the CIS standard-page table cannot drift"
run = "uv run --with pyyaml python3 tools/gen_benchmarks.py"

[tasks."gen:pages"]
description = "Generate the site's rule fiches from the rule base (one per neutral id, authored prose preserved)"
depends = ["gen", "gen:benchmarks"]
run = "uv run --with pyyaml --with fastmcp python3 tools/generate_rule_pages.py"

[tasks."site:verify"]
description = "FAIL if the site content has drifted from the rule base (a control with no prose, prose about a control that no longer exists, an OS on no page)"
depends = ["gen:pages"]
run = "uv run --with pyyaml python3 tools/verify_site_content.py"

# ---- Bilingual Astro site -------------------------------------------------------------------
[tasks."site:dev"]
description = "Dev server for the hardening site (FR/EN)"
dir = "{{config_root}}/site"
run = "npm install && npm run dev"

[tasks."site:build"]
description = "Build the static hardening site"
depends = ["gen:pages", "gen:cli", "gen:example", "oscal", "site:verify"]
dir = "{{config_root}}/site"
run = "npm install && npm run build"

[tasks."site:links"]
description = "FAIL if any internal link of the built site lands on a page that does not exist"
run = "uv run python3 tools/check_site_links.py"

[tasks."site:preview"]
description = "Preview the built site locally"
dir = "{{config_root}}/site"
run = "npm run preview"

[tasks."site:perf"]
description = "Lighthouse on every page (unlighthouse, headless). Start `mise run site:preview` in another shell first, then run this; report lands in site/.unlighthouse/."
dir = "{{config_root}}/site"
# -y so npx fetches it without prompting: @unlighthouse/cli is no longer a devDependency.
# It pulled lighthouse, puppeteer-core and @puppeteer/browsers, 512 packages carrying six
# HIGH advisories with no upstream fix (npm's only "fix" was downgrading it eight minor
# versions). This task already invoked it through npx, so nothing here changes except that
# a manual, local perf audit stops dictating the security posture of the published site.
run = "npx -y unlighthouse-ci --site http://localhost:4321/en/ --build-static"

[tasks."site:lint-css"]
description = "Lint the stylesheet: flag duplicate selectors + hardcoded colors (must use tokens). Guards against CSS debt."
dir = "{{config_root}}/site"
run = "npx stylelint 'src/styles/*.css'"

[tasks."site:validate-seo"]
description = "Validate every JSON-LD block in the built site against the Rich Results Test rules (run after site:build)"
dir = "{{config_root}}/site"
run = "node scripts/validate-jsonld.mjs dist"

[tasks."site:validate-hreflang"]
description = "FAIL if the two language versions are not declared as reciprocal alternates (run after site:build). Catches the five mistakes that make an engine discard the cluster."
dir = "{{config_root}}/site"
run = "node scripts/validate-hreflang.mjs dist"

[tasks."site:quality"]
description = "Page-quality audit of the built site: titles, meta descriptions, image alt text, a single h1, the lang attribute. Fails on anything over the budget in site/quality-budget.json. Add --report for the breakdown."
dir = "{{config_root}}/site"
run = "node scripts/quality.mjs dist"

[tasks."site:shell-parity"]
description = "On the install pages, EN and FR must run the same commands: only the trailing comment may differ."
# A command is not a translation. When a page is edited in one language and not the other, both
# still build and pass every other check, and the gap only surfaces when someone reads both.
dir = "{{config_root}}/site"
run = "node scripts/shell-blocks-parity.mjs dist"

[tasks."site:install-single-source"]
description = "No page may keep its own copy of an install command: the shell blocks must render src/data/install.ts, and none may pipe a download into a shell."
# The install instructions lived in three places and drifted: one page led with a build from source
# and said no release existed, another led with the binary, and one told the reader to curl | sh
# while the other explained why that is indefensible for a hardening tool. Each was found by a
# reader, one at a time. This is the guard that ends that class of report.
dir = "{{config_root}}/site"
run = "node scripts/install-single-source.mjs src"

[tasks."site:nav-responsive"]
description = "Resolve the header's `display` at phone, tablet and desktop widths in the BUILT css: the flat links and the hamburger must never both be visible."
# Reads the resolved value, not the presence of a rule. A media query adds no specificity, so a
# later unscoped `.nav-links{display:flex}` silently beat the `max-width:980px` rule that hides
# them, and the mobile header wrapped onto two rows on every page. Nothing in the source looked
# wrong; only the cascade was.
dir = "{{config_root}}/site"
run = "node scripts/nav-responsive.mjs dist"

[tasks."site:indexnow"]
description = "Tell Bing and Yandex which URLs changed (run after site:build and after the deploy). Refuses while the build is noindex. Add --dry-run to see the payload."
dir = "{{config_root}}/site"
run = "node scripts/indexnow.mjs dist"

[tasks."bench"]
description = "Effective-config benchmark vs OpenSCAP/Lynis (drop-in false-negative). Args: <user@host> <key> <ssg-ds.xml>. Lab: test-vms/bench.sh provisions a fresh snapshot each run."
run = "bash {{config_root}}/tools/benchmark/effective-config-bench.sh"

[tasks."coverage:gap"]
description = "Pavois vs SSG/oscap coverage gap (triaged by oscap N/A). Args: --os <os> --datastream <ssg-ds.xml> [--oscap-results <xml>] [--pavois-report <json>] [--create-issues]"
run = "uv run --with pyyaml python3 tools/coverage_gap.py"

[tasks."gaps"]
description = "PILOT: per-OS remediation-coverage gaps (parity = fix exists elsewhere, port it; orphan = none anywhere; manual/kernel skipped). Args: [os] | --parity. Drives cross-OS remediation parity."
run = "uv run --with pyyaml python3 tools/remediation_gaps.py"

[tasks."rule:show"]
description = "Show one control + its mappings, e.g. `mise run rule:show -- --os debian12 --id ssh-disable-root-login`"
depends = ["build"]
run = "{{config_root}}/go/pavois rules"

[tasks."rule:test"]
description = "Run ONLY one control on a target (fast iteration), e.g. `mise run rule:test -- <target> --sudo --controls ssh-disable-root-login`"
depends = ["build"]
run = "{{config_root}}/go/pavois scan"

[tasks."embed:corpus"]
description = "Copy the rendered .rb corpus into the binary's embed dir (for a self-contained release build)"
depends = ["render"]
run = "rm -rf {{config_root}}/go/internal/corpus/profiles/linux && cp -r {{config_root}}/profiles/linux {{config_root}}/go/internal/corpus/profiles/linux"

[tasks."embed:reference"]
description = "Copy the per-OS hardening reference into the binary's embed dir (for a self-contained release build)"
# The corpus was embedded and the reference was not, so a downloaded binary could scan a host and
# then failed on `harden plan` with a path resolved against the current directory (#286). Half the
# product was unreachable for anyone who installed from a release.
depends = ["gen"]
# The copy itself lives in tools/release/embed_reference.sh, and the release workflow runs that same
# script. It used to be written out here AND again in the workflow: when this task learned about the
# reference, the workflow did not, and v0.1.2 shipped with three empty embed directories.
run = "bash {{config_root}}/tools/release/embed_reference.sh {{config_root}}"

[tasks."embed:all"]
description = "Populate every embed dir (corpus + reference), as a release build does"
depends = ["embed:corpus", "embed:reference"]
run = "echo 'corpus and reference embedded'"

[tasks."regression"]
description = "PILOT: per-OS scan-result baseline + regression detector. Keeps the best result per OS; a re-scan that flips baseline-passing controls to FAIL (or drops lynis) exits non-zero. Args: <scan.json> --os <os> [--lynis N] [--update]"
run = "uv run --with pyyaml python3 tools/regression.py"

# ---- Gates: what must be true before pushing --------------------------------------------------
[tasks.test]
description = "Go tests (race detector on)"
dir = "{{config_root}}/go"
run = "go test -race ./..."

[tasks.lint]
description = "gofmt + go vet + golangci-lint over the Go module"
dir = "{{config_root}}/go"
run = """
test -z "$(gofmt -l .)" || { echo 'gofmt needed:'; gofmt -l .; exit 1; }
go vet ./...
golangci-lint run ./...
"""

[tasks."lint:py"]
description = "ruff check + ruff format --check + bandit over tools/: exactly what python.yml runs"
# The pre-commit hooks only see the files a commit touches, so a lint error in an untouched file
# reaches CI unopposed. This is how tools/reconcile_os.py failed the first PR of this branch: 5
# ruff errors in a file nobody had touched in months.
run = """
ruff check tools/
ruff format --check tools/
bandit -q -r tools/ -c pyproject.toml
"""

[tasks.testplan]
description = "What this diff earns you, cheapest first, and what each run does NOT prove. `--check` fails on a path no rule sorts."
run = "python3 {{config_root}}/tools/testplan.py"

[tasks."lint:emdash"]
description = "Refuse the em-dash anywhere in the tracked tree (an AI tell, and it has broken a generated GRUB line)"
run = "python3 {{config_root}}/tools/lint_emdash.py"

[tasks."lint:install-docs"]
description = "FAIL if a page retypes an install command, pipes a download into a shell, or renders a block install.ts does not export"
# install.ts has claimed since it was written that this linter fails the build. It did not exist,
# which is the worst of both: a comment that tells readers the drift is guarded, and no guard. The
# install instructions are exactly the content that rots unwatched, and the last time they did, a
# release shipped telling users to satisfy a prerequisite it never showed them how to satisfy.
run = "python3 {{config_root}}/tools/lint_install_docs.py"

[tasks."doc:commands"]
description = "Print or check the commands the documentation tells a reader to run (--list | --check | --id <block> [--lang fr])"
# The documentation is the test input: tools/release/scenario.sh runs THESE blocks on the VM rather
# than a hand-written copy, so a page that changes changes what gets proved. --check also fails when
# the two languages would run different commands, which is not a translation question.
dir = "{{config_root}}"
run = "node --experimental-strip-types {{config_root}}/tools/doc_commands.mjs"

[tasks."lint:install-docs:test"]
description = "Prove lint:install-docs rejects each defect it claims to catch (a linter that never failed cannot be trusted)"
run = "python3 {{config_root}}/tools/lint_install_docs_test.py"

[tasks."lint:embed"]
description = "FAIL if the binary embeds a directory the RELEASE build never fills (an empty embed is not a build error)"
# v0.1.2 shipped with three empty embed directories: `scan` worked and `harden plan`, `rules`,
# `norms` and `oscal` answered "this binary embeds none and none is on disk". Nothing local could
# see it, because a local build fills them first. Checked against the v0.1.2 tree: this rule flags
# all three. `--selftest` plants the same defect in a copy and demands red.
run = "python3 {{config_root}}/tools/lint_embed_release.py"

[tasks."lint:embed:test"]
description = "Prove lint:embed bites: plant an embed directory no release step fills and demand red"
run = "python3 {{config_root}}/tools/lint_embed_release.py --selftest"

[tasks."lint:norm-refs"]
description = "FAIL if a norm mapping holds anything but a reference (the claim /attribution makes about redistribution)"
run = "uv run --with pyyaml python3 {{config_root}}/tools/lint_norm_refs.py"

[tasks."lint:never-auto"]
description = "FAIL if a remediation held back for safety has drifted back to automatic"
run = "uv run --with pyyaml python3 {{config_root}}/tools/lint_never_auto.py"

[tasks."validate:run"]
description = "Is a scan TRUSTWORTHY? Flags verdicts the scan never measured: empty output, shell errors leaking into results, N controls failing with one identical message, a whole family wiped out. Different question from whether the machine is compliant."
run = "python3 {{config_root}}/tools/validate_run.py"

[tasks."lint:shell-first-word"]
description = "FAIL if a control's command would lose its privileges under --sudo (starts with a shell keyword, or reads a privileged binary inside $( )). Such a control reports a verdict it never measured."
run = "python3 {{config_root}}/tools/lint_shell_first_word.py"

[tasks."secrets:history"]
description = "Scan EVERY commit for credentials and lab topology, not just what a push adds. The hooks and the range-based CI job only ever see a diff; publishing ships the whole history."
run = "python3 {{config_root}}/tools/scan_history_secrets.py"

[tasks."release:preflight"]
description = "Everything that must be true before a tag exists. Args: vX.Y.Z"
# Locally, and before anything irreversible: the workflow's own guards only speak after the tag is
# pushed, and a published release with a wrong binary cannot be replayed at all. The checks that
# matter most here are the two CI cannot make: that the corpus the binary will EMBED is the one
# rendered from rules.yml, and that the golden-path campaign behind the support claim measured that
# same corpus rather than an older one.
run = "bash --noprofile --norc {{config_root}}/tools/release/preflight.sh"

[tasks."release:pre-public"]
description = "What becomes visible when the repository goes public, beyond the files: issues, pull requests, branches and tags."
# The history is purged and scanned on every push, which is the part everyone thinks about. Going
# public also reveals every issue title, body and comment, every PR, and every ref name, none of
# which lives in the working tree and none of which any hook has ever read.
run = "python3 {{config_root}}/tools/release/pre_public.py"

[tasks."release:standalone"]
description = "Run the built binary from an empty directory: the embedded corpus must be listed and a scan must grade."
# v0.1.0 shipped unusable because every test, every campaign and the preflight ran from the
# repository, where profiles/ is on disk. The corpus was genuinely compiled into the binary; the
# code that looked for a profile asked the filesystem, which is always false outside a checkout.
run = "bash --noprofile --norc {{config_root}}/tools/release/standalone_binary.sh"

[tasks."release:same-outside"]
description = "THE INVARIANT: the same binary, run from the repository and from an empty directory, must know the same things."
# Seven defects of one family were found one at a time, by users, after releases: scan (v0.1.0),
# harden plan + rules + norms + oscal (#286), verify and oscal's baseline (v0.1.3), harden plan
# --from (#295), bundle's ruleset digest (#296). Each was a DIFFERENT lookup, so grep does not
# generalise and the next one will have a shape nobody enumerated. This compares behaviour instead:
# a difference in what the binary KNOWS is a defect whatever produced it. Seconds, no VM, no target.
run = "bash --noprofile --norc {{config_root}}/tools/release/same_outside_checkout.sh"

[tasks."release:same-outside:test"]
description = "Prove the invariant harness bites: put each known defect back, rebuild, demand red"
run = "bash --noprofile --norc {{config_root}}/tools/release/falsify_outside_checkout.sh"

[tasks."release:standalone:test"]
description = "Prove release:standalone bites: remove each embedded asset in a copy, rebuild, demand red."
# Its first version passed with behavioral-probes.yml and audit.rules deleted from the embed: it
# matched an error string the code no longer produced, and nothing exercised the ruleset at all.
# Minutes (a rebuild per mutant), so it is out of prepush and belongs before a release.
run = "bash --noprofile --norc {{config_root}}/tools/release/falsify_embed.sh"

[tasks."release:ci-build"]
description = "Run release.yml ITSELF under act and guard the binary it produces: what the release builds, not what you build."
# Every check this project had ran on a binary built here, where `mise run embed:all` fills the
# embed directories first. The release workflow fills the ones it knows about, and v0.1.2 added
# three it did not, so the published artifact carried an empty reference while everything local was
# green. A hand-written replay of the workflow would drift from the workflow the same way; this
# reads release.yml. Needs docker. Args: vX.Y.Z
run = "bash --noprofile --norc {{config_root}}/tools/release/ci_release_build.sh"

[tasks."release:published"]
description = "Download the PUBLISHED binary, run it on a fresh VM: the only check whose subject is the artifact a user gets."
# act is a simulation of the runner, not the runner. This one downloads what GitHub published,
# verifies its checksum and SLSA attestation, installs the engine the way the docs say to, and runs
# the commands. Against the published v0.1.2 it reports four failures. Args: vX.Y.Z
run = "bash --noprofile --norc {{config_root}}/tools/release/verify_published_vm.sh"

[tasks."release:scenario"]
description = "THE complete first-run scenario on one disposable VM: install, doctor, scan, harden plan, from a machine that has nothing. Every closed first-run issue has an assertion here."
# Two releases shipped a binary that could not do its job, and both got through the same way: every
# test ran inside the repository, where profiles/ and docs/reference/ are on disk. Both were found
# by a user on a fresh VM. This is that user, automated. Args: --binary released | --os | --keep
run = "bash --noprofile --norc {{config_root}}/tools/release/scenario.sh"

[tasks."release:evidence"]
description = "Did a golden-path campaign prove the CURRENT corpus, on the systems claimed? Args: <os>..."
run = "python3 {{config_root}}/tools/release/evidence.py"

[tasks.prepush]
description = "Everything a pull request will fail on that costs seconds and needs no target"
# Deterministic, offline, 13s wall-clock measured on this repo (mise runs the dependencies in
# parallel, so the total is the slowest gate, not the sum). That budget is
# the selection rule, not an accident: a gate people cannot clear is the gate everybody learns to
# skip with `--no-verify`, and a hook that is skipped protects nothing.
#
# What is deliberately OUT, and why:
#   site:verify   31s, and it REGENERATES site/src/content/rules/: a hook must not rewrite the
#                 tree it is checking. Earned by a site/ or rules.yml diff instead (testplan).
#   validate      needs the SSG datastreams: network, minutes.
#   a real scan   needs a live debian12 VM. It is the one gate CLAUDE.md makes non-negotiable for
#                 a rules.yml change, and it can never be a hook. `testplan --check` is what says
#                 so on every push, since nothing else will.
depends = ["build", "test", "lint", "lint:py", "lint:emdash", "lint:norm-refs", "lint:never-auto", "lint:shell-first-word", "lint:install-docs", "lint:embed", "gen:verify", "lint:rules", "validate:mappings", "validate:i18n"]
run = "python3 {{config_root}}/tools/testplan.py --check"

[tasks."lint:ci"]
description = "Guard the pipeline itself: actionlint (+shellcheck on run: blocks), zizmor (workflow vulns), poutine (CI/CD exploitation chains)"
# Same three tools, same versions as .github/workflows/workflow-security.yml. Pinned in [tools],
# so `mise install` gives a contributor the exact CI gate rather than "whatever is on PATH".
run = """
actionlint
zizmor --no-progress --min-severity=low .github/workflows/
poutine analyze_local . --format pretty
"""

[tasks.falsify]
description = "Replay the declared falsifications: prove each guarded test still BITES (mutate a copy, demand red)"
# Minutes, and it copies + rebuilds the module per mutation, so it is deliberately OUT of prepush
# (see the note there). `falsify:selftest` is the cheap half and belongs in CI.
run = "uv run --with pyyaml python3 {{config_root}}/tools/falsify.py"

[tasks."falsify:selftest"]
description = "Prove the falsification harness itself: with nothing mutated, every declared test must stay GREEN"
run = "uv run --with pyyaml python3 {{config_root}}/tools/falsify.py --selftest"

[tasks."hooks:install"]
description = "Install the git hooks: pre-commit (quality + secrets) and tools/hooks/pre-push (no push to main + the offline gate)"
# The pre-push hook is versioned rather than left in .git/hooks: a control that lives on one
# machine is a control that does not exist. It is copied, not symlinked, because git refuses to
# run a hook it cannot stat through a broken link (a worktree, a moved checkout).
run = """
pre-commit install
install -m 0755 {{config_root}}/tools/hooks/pre-push {{config_root}}/.git/hooks/pre-push
echo "hooks installed: pre-commit (commit) + pre-push (no-main guard + mise run prepush)"
"""

[tasks."ruleset"]
description = "Protect the default branch (run IMMEDIATELY after the repo goes public: rulesets need a public repo)"
run = "bash {{config_root}}/tools/apply-branch-ruleset.sh"

[tasks."vm"]
description = "Test VMs on Incus. VMs, never containers: `mise run vm -- up debian12` | list | ip <os> | down <os>"
# 259 of the 789 controls cannot be answered by a container (kernel, mounts, auditd, cmdline):
# a container shares the host kernel, so those controls would measure YOUR machine, and a scan
# from a hardened workstation would come back green about a target it never inspected.
run = "python3 {{config_root}}/tools/vm.py"

[tasks."matrix"]
description = "Run the hardening campaign across the supported OSes, one at a time, and print the table"
# Serial on purpose: each VM wants 4 GB and a kernel build ~20 GB of disk, so two campaigns at once
# on a workstation measure contention, not hardening.
run = "bash {{config_root}}/tools/matrix.sh"

[tasks."demo"]
description = "Re-record the demo video from tools/demo/pavois.tape against a live VM"
# The tape is the source and the video is a build product of it. The previous demo had no source
# at all, so nobody could re-record it or tell what it had actually run.
# Needs: PAVOIS_DEMO_HOST, PAVOIS_SUDO_PASSWORD, and vhs + ttyd + ffmpeg on PATH.
run = "bash {{config_root}}/tools/demo/record.sh"
# Act 2 (the hardened host) uses the same script with a different tape:
#   PAVOIS_DEMO_TAPE=tools/demo/pavois-after.tape mise run demo
