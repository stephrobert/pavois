name: linux-rhel9
title: "pavois: RHEL 9 / Rocky 9 corpus (effective config, multi-standard)"
maintainer: pavois community
license: Apache-2.0
summary: >-
  pavois corpus for RHEL 9 / Rocky 9, by technical domain, EFFECTIVE config,
  multi-standard mappings as tags. Rendered from the pavois reference
  (docs/reference/pavois-content/).
version: 0.1.0
supports:
  - platform-family: redhat
    release: "9*"
inputs:
  - name: level
    description: "Level to evaluate, interpreted per standard (e.g. cis:1, bp28:minimal)"
    type: string
    value: all
