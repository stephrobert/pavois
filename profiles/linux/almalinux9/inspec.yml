name: linux-almalinux9
title: "pavois — corpus AlmaLinux 9 (config effective, multi-normes)"
maintainer: pavois community
license: Apache-2.0
summary: >-
  Corpus pavois pour AlmaLinux 9, par domaine technique, config EFFECTIVE,
  mappings multi-normes en tags. Rendu depuis la référence pavois
  (docs/reference/pavois-content/).
version: 0.1.0
supports:
  - platform-family: redhat
    release: "9*"
inputs:
  - name: level
    description: "Niveau à évaluer, interprété par norme (ex. cis:1, bp28:minimal)"
    type: string
    value: all
