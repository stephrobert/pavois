name: linux-debian13
title: "pavois — Debian 13 corpus (effective config, multi-standard)"
maintainer: pavois community
license: Apache-2.0
summary: >-
  pavois corpus for Debian 13 (Trixie), by technical domain, EFFECTIVE config,
  multi-standard mappings as tags. Rendered from the pavois reference
  (docs/reference/pavois-content/).
version: 0.1.0
supports:
  - platform-name: debian
    release: "13*"
inputs:
  - name: level
    description: "Level to evaluate, interpreted per standard (e.g. cis:1, bp28:minimal)"
    type: string
    value: all
