name: linux-ubuntu2604
title: "pavois: Ubuntu 26.04 corpus (effective config, multi-standard)"
maintainer: pavois community
license: Apache-2.0
summary: >-
  pavois corpus for Ubuntu 26.04, by technical domain, EFFECTIVE config,
  multi-standard mappings as tags. Rendered from the pavois reference
  (docs/reference/pavois-content/).
version: 0.1.0
supports:
  - platform-name: ubuntu
    release: "26.04"
inputs:
  - name: level
    description: "Level to evaluate, interpreted per standard (e.g. cis:1, bp28:minimal)"
    type: string
    value: all
