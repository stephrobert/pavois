# Accepted risks (generated — do not edit by hand). Each control here is
# NOT enforced; the justification is what an auditor reads.
# Source: the `waiver:` field in docs/reference/rules.yml.
fileperm-sshd-drop-in-config:
  justification: 'Defective control: it asserts /etc/ssh/sshd_config.d is NOT executable by owner, but
    a DIRECTORY needs the owner-execute bit to be traversable at all — no mode satisfies both this check
    and a working sshd. The directory is hardened to 0700 (root-only). Waived until the upstream check
    is fixed.'
  run: false
kmod-loading-disabled:
  justification: 'kernel.modules_disabled=1 permanently blocks module loading, which strands the nftables
    firewall (it needs nf_conntrack for `ct state`) and can cut SSH. Enforcing it would break a control
    we rank higher (a working host firewall). Accepted risk: modules stay loadable.'
  run: false
mount-var-noexec:
  justification: 'noexec on /var breaks apt/dnf: maintainer scripts and rpm scriptlets execute under /var,
    leaving the package manager unusable (no patching). CIS itself only asks for nodev,nosuid on /var.
    Accepted risk: /var keeps exec, and /var/tmp + /var/log DO carry noexec.'
  run: false
partition-usr:
  justification: 'A separate /usr filesystem must be mounted by the initramfs before switch-root; getting
    it wrong leaves the host unbootable, with no remote recovery. The security gain does not justify bricking
    a fleet. Accepted risk: /usr stays on the root filesystem.'
  run: false
