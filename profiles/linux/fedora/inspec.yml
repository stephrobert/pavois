name: linux-fedora
title: "pavois — corpus Fedora (config effective, multi-normes)"
maintainer: pavois community
license: Apache-2.0
summary: >-
  Corpus pavois pour Fedora (versions courantes 42/43). Par domaine technique, config EFFECTIVE, mappings
  multi-normes en tags. Rendu depuis la référence pavois (docs/reference/pavois-content/).
version: 0.1.0
supports:
  - platform-name: fedora
    release: "4*"
inputs:
  - name: level
    description: "Niveau à évaluer, interprété par norme (ex. cis:1, bp28:minimal)"
    type: string
    value: all
