name: linux-debian12
title: "pavois — corpus Debian 12 (config effective, multi-normes)"
maintainer: pavois community
license: Apache-2.0
summary: >-
  Corpus pavois pour Debian 12, par domaine technique, config EFFECTIVE,
  mappings multi-normes en tags. Rendu depuis la référence pavois
  (docs/reference/pavois-content/).
version: 0.1.0
supports:
  - platform-name: debian
    release: "12*"
inputs:
  - name: level
    description: "Niveau à évaluer, interprété par norme (ex. cis:1, bp28:minimal)"
    type: string
    value: all
