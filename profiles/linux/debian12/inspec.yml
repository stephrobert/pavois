name: linux-debian12
title: "pavois: Debian 12 corpus (effective config, multi-standard)"
maintainer: pavois community
license: Apache-2.0
summary: >-
  pavois corpus for Debian 12, by technical domain, EFFECTIVE config,
  multi-standard mappings as tags. Rendered from the pavois reference
  (docs/reference/pavois-content/).
version: 0.1.0
supports:
  - platform-name: debian
    release: "12*"
  # train names a Raspberry Pi running its Debian "raspbian" (/etc/rpi-issue wins over
  # ID=debian in /etc/os-release): same OS, same corpus, so accept it explicitly. Without
  # this entry cinc refuses the profile on a Pi and every control evaluates to nothing.
  - platform-name: raspbian
    release: "12*"
inputs:
  - name: level
    description: "Level to evaluate, interpreted per standard (e.g. cis:1, bp28:minimal)"
    type: string
    value: all
