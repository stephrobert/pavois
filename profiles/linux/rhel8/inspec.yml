name: linux-rhel8
title: "pavois — corpus RHEL 8 / Rocky 8 / AlmaLinux 8 (config effective, multi-normes)"
maintainer: pavois community
license: Apache-2.0
summary: >-
  Corpus pavois pour RHEL 8 et clones binaires (Rocky 8, AlmaLinux 8), par
  domaine technique, config EFFECTIVE, mappings multi-normes en tags. Rendu
  depuis la référence pavois (docs/reference/pavois-content/).
version: 0.1.0
supports:
  - platform-family: redhat
    release: "8*"
inputs:
  - name: level
    description: "Niveau à évaluer, interprété par norme (ex. cis:1, bp28:minimal)"
    type: string
    value: all
