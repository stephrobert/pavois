name: linux-rhel8
title: "pavois — RHEL 8 / Rocky 8 / AlmaLinux 8 corpus (effective config, multi-standard)"
maintainer: pavois community
license: Apache-2.0
summary: >-
  pavois corpus for RHEL 8 and binary clones (Rocky 8, AlmaLinux 8), by
  technical domain, EFFECTIVE config, multi-standard mappings as tags. Rendered
  from the pavois reference (docs/reference/pavois-content/).
version: 0.1.0
supports:
  - platform-family: redhat
    release: "8*"
inputs:
  - name: level
    description: "Level to evaluate, interpreted per standard (e.g. cis:1, bp28:minimal)"
    type: string
    value: all
