name: linux-rhel10
title: "pavois: RHEL 10 / Rocky 10 / AlmaLinux 10 corpus (effective config, multi-standard)"
maintainer: pavois community
license: Apache-2.0
summary: >-
  pavois corpus for RHEL 10 and rebuilds, by technical domain, EFFECTIVE config,
  multi-standard mappings as tags. Rendered from the pavois reference
  (docs/reference/pavois-content/).
version: 0.1.0
supports:
  - platform-family: redhat
    release: "10*"
inputs:
  - name: level
    description: "Level to evaluate, interpreted per standard (e.g. cis:1, bp28:minimal)"
    type: string
    value: all
