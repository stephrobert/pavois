name: linux-ubuntu2404
title: "pavois — corpus Ubuntu 24.04 (config effective, multi-normes)"
maintainer: pavois community
license: Apache-2.0
summary: >-
  Corpus pavois pour Ubuntu 24.04, par domaine technique, config EFFECTIVE,
  mappings multi-normes en tags. Rendu depuis la référence pavois
  (docs/reference/pavois-content/).
version: 0.1.0
supports:
