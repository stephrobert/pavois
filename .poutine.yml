# Poutine (CI/CD supply-chain analysis) config for Pavois.
# https://github.com/boostsecurityio/poutine
#
# Objective: zero findings. The ONLY finding is `github_action_from_unverified_creator_used` (a
# "note"), raised for two actions we deliberately adopt and pin by 40-char commit SHA. We acquit them
# TARGETED, by package, never by disabling the rule globally, so any NEW unverified action still trips
# the rule and gets reviewed.
#
#   - getplumber/plumber      the CI/CD trust-policy scanner this very workflow runs; pinned by SHA,
#                             and the action verifies the SLSA build-provenance of the binary it fetches.
#   - softprops/action-gh-release  the release-asset uploader; widely used, pinned by SHA.
skip:
  - rule: github_action_from_unverified_creator_used
    purl:
      - pkg:githubactions/getplumber/plumber
      - pkg:githubactions/softprops/action-gh-release
