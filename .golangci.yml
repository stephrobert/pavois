# golangci-lint v2 config for the pavois Go binary (./go). Locks in the standard linters and adds
# security (gosec) + correctness (errorlint, bodyclose) + hygiene (misspell, unconvert). Mirrors
# .pre-commit-config.yaml and the Go CI workflow.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gosec # security: hardcoded creds, weak crypto, unsafe exec/file APIs
    - errorlint # %w / errors.Is misuse
    - bodyclose # unclosed HTTP response bodies
    - unconvert # redundant type conversions
  settings:
    gosec:
      excludes:
        # pavois deliberately execs cinc-auditor / docker / ssh with CONTROLLED, validated args
        # (never shell, never raw user strings): the safe equivalent of bandit's B603 skip.
        - G204
        # pavois reads files by path it is given (profiles, InSpec JSON, reports): inherent to a
        # CLI scanner; the paths are operator-supplied/internal, never untrusted web input.
        - G304
  exclusions:
    generated: lax
    rules:
      # Tests legitimately use weak randomness, temp paths and unchecked errors in fixtures.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
